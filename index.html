<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Layer - Agentic Context Workspace">
    <title>Layer — Agentic Context Workspace</title>
    
    <meta name="theme-color" content="#0a0a0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="pwa-manifest-link">
    <link rel="icon" id="pwa-favicon" type="image/svg+xml">
    <meta name="pwa-single-file" content="true">

    <style>
        :root {
            --bg-base: #0a0a0b;
            --bg-elevated: #141416;
            --bg-surface: #1c1c1f;
            --bg-hover: #252528;
            --border-subtle: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.15);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-w: 260px;
            --context-w: 340px;
        }

        [data-theme="light"] {
            --bg-base: #f8f9fa;
            --bg-elevated: #ffffff;
            --bg-surface: #f1f3f5;
            --bg-hover: #e9ecef;
            --border-subtle: rgba(0,0,0,0.08);
            --border-strong: rgba(0,0,0,0.15);
            --text-primary: #111113;
            --text-secondary: #495057;
            --text-muted: #868e96;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1c45c7;
            --accent-glow: rgba(37, 99, 235, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.5;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr var(--context-w);
            grid-template-rows: 1fr;
            height: 100vh;
            background-image: radial-gradient(circle at 100% 0%, rgba(59, 130, 246, 0.03), transparent 40%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

        button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; }
        a { color: var(--accent-blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .sidebar { border-right: 1px solid var(--border-subtle); background: var(--bg-elevated); display: flex; flex-direction: column; overflow-y: auto; height: 100vh; z-index: 10; transition: transform 300ms ease; }
        .main-content { overflow-y: auto; background: var(--bg-base); position: relative; height: 100vh; }
        .context-panel { border-left: 1px solid var(--border-subtle); background: var(--bg-elevated); display: flex; flex-direction: column; overflow: hidden; height: 100vh; z-index: 10; transition: transform 300ms ease; }

        .sb-header { padding: 24px 20px 12px; display: flex; align-items: center; gap: 10px; }
        .sb-logo { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .sb-logo span { color: var(--accent-blue); }
        .sb-section { padding: 8px 12px; }
        .sb-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); padding: 8px 8px 4px; font-weight: 600; }
        .sb-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-secondary); width: 100%; text-align: left; transition: background var(--transition), color var(--transition); font-size: 14px; position: relative; }
        .sb-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sb-item.active { background: var(--bg-hover); color: var(--text-primary); }
        .sb-item.active::before { content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); height: 16px; width: 3px; background: var(--accent-blue); border-radius: 0 2px 2px 0; }
        .sb-item svg { width: 16px; height: 16px; flex-shrink: 0; }
        .sb-list { flex: 1; padding-bottom: 12px; overflow-y: auto; }
        .sb-footer { border-top: 1px solid var(--border-subtle); padding: 12px; display: flex; gap: 8px; }

        .mobile-topbar { display: none; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); align-items: center; justify-content: space-between; background: var(--bg-elevated); position: sticky; top: 0; z-index: 5; }
        .mobile-topbar h2 { font-size: 16px; font-weight: 600; }
        .icon-btn { padding: 6px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .icon-btn svg { width: 20px; height: 20px; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-elevated); border-top: 1px solid var(--border-subtle); padding: 8px 0 16px; justify-content: space-around; z-index: 20; }

        .view { padding: 32px 48px; max-width: 900px; margin: 0 auto; padding-bottom: 100px; animation: fadeIn 200ms ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .view-header { margin-bottom: 32px; }
        .view-title { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
        .view-subtitle { color: var(--text-secondary); font-size: 16px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px; cursor: pointer; transition: border-color var(--transition), transform var(--transition), background var(--transition); display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
        .card:hover { border-color: var(--border-strong); background: var(--bg-surface); }
        .card-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .card-desc { font-size: 13px; color: var(--text-secondary); flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .layer-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-secondary); font-weight: 500; }
        .badge.high { color: #f87171; border-color: rgba(248,113,113,0.2); background: rgba(248,113,113,0.1); }
        .badge.medium { color: #fbbf24; border-color: rgba(251,191,36,0.2); background: rgba(251,191,36,0.1); }
        .badge.low { color: #34d399; border-color: rgba(52,211,153,0.2); background: rgba(52,211,153,0.1); }

        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; transition: all var(--transition); border: 1px solid transparent; }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-primary:hover { background: var(--accent-blue-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border-subtle); }
        .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-strong); }
        .btn-ghost { color: var(--text-secondary); }
        .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-danger { background: rgba(248,113,113,0.1); color: #f87171; border-color: rgba(248,113,113,0.2); }
        .btn-danger:hover { background: rgba(248,113,113,0.2); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 100ms ease; }
        .modal { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 500px; box-shadow: var(--shadow-lg); animation: slideUp 200ms ease; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .input { width: 100%; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; color: var(--text-primary); transition: border-color var(--transition); }
        .input:focus { outline: none; border-color: var(--accent-blue); }
        .input:disabled { opacity: 0.5; cursor: not-allowed; }
        textarea.input { resize: vertical; min-height: 80px; line-height: 1.5; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

        .qc-overlay { background: rgba(0,0,0,0.4); }
        .qc-modal { max-width: 560px; padding: 0; overflow: hidden; }
        .qc-input { width: 100%; border: none; background: transparent; padding: 24px; font-size: 22px; color: var(--text-primary); font-weight: 500; }
        .qc-input:focus { outline: none; }
        .qc-input::placeholder { color: var(--text-muted); }
        .qc-footer { padding: 12px 16px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); }
        .qc-types { display: flex; gap: 4px; }
        .qc-type-btn { padding: 4px 10px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); border: 1px solid transparent; }
        .qc-type-btn.active { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-subtle); }

        .cp-overlay { background: rgba(0,0,0,0.4); align-items: flex-start; padding-top: 15vh; }
        .cp-modal { max-width: 600px; border-radius: var(--radius-md); overflow: hidden; }
        .cp-search { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); font-size: 16px; background: var(--bg-elevated); }
        .cp-results { max-height: 400px; overflow-y: auto; padding: 8px; }
        .cp-item { padding: 10px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .cp-item:hover, .cp-item.selected { background: var(--bg-hover); }
        .cp-item svg { width: 16px; height: 16px; color: var(--text-secondary); }
        .cp-item-type { margin-left: auto; font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        .ctx-header { padding: 16px; border-bottom: 1px solid var(--border-subtle); }
        .ctx-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ctx-tabs { display: flex; gap: 4px; }
        .ctx-tab { padding: 6px 10px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .ctx-tab.active { background: var(--bg-hover); color: var(--text-primary); }
        .ctx-close-btn { display: none; padding: 4px; }
        .ctx-content { flex: 1; overflow-y: auto; padding: 16px; }
        
        .ai-msg { margin-bottom: 16px; }
        .ai-msg-role { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
        .ai-msg-content { font-size: 14px; line-height: 1.6; color: var(--text-primary); }
        .ai-msg-assistant .ai-msg-content { background: var(--bg-surface); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
        
        .ai-thinking { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
        .ai-thinking span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: blink 1.4s infinite both; }
        .ai-thinking span:nth-child(2) { animation-delay: .2s; }
        .ai-thinking span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

        .ai-action-card { background: var(--bg-base); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 12px; margin-top: 8px; }
        .ai-action-title { font-size: 12px; font-weight: 600; color: var(--accent-blue); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ai-action-group { margin-bottom: 12px; }
        .ai-action-group:last-of-type { margin-bottom: 0; }
        .ai-action-group-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .ai-action-item { font-size: 13px; padding: 4px 0; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
        .ai-action-item svg { width: 14px; height: 14px; color: var(--accent-blue); }
        .ai-action-item-content { font-size: 11px; color: var(--text-muted); margin-left: 8px; font-style: italic; }

        .ai-suggestions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .ai-suggestion { text-align: left; padding: 8px 12px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-primary); }
        .ai-suggestion:hover { background: var(--bg-hover); border-color: var(--border-strong); }

        .ctx-menu { position: fixed; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 6px; z-index: 200; box-shadow: var(--shadow-lg); min-width: 180px; animation: fadeIn 100ms ease; }
        .ctx-menu-item { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
        .ctx-menu-item:hover { background: var(--bg-hover); }
        .ctx-menu-item.danger { color: #f87171; }
        .ctx-menu-sep { height: 1px; background: var(--border-subtle); margin: 4px 0; }

        .snackbar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); border: 1px solid var(--border-strong); padding: 12px 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); z-index: 150; display: flex; align-items: center; gap: 12px; animation: slideUp 200ms ease; }
        .snackbar-text { font-size: 14px; }

        .empty-state { text-align: center; padding: 48px 24px; }
        .empty-state-icon { width: 48px; height: 48px; margin: 0 auto 16px; opacity: 0.5; }
        .empty-state-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .empty-state-desc { color: var(--text-secondary); max-width: 400px; margin: 0 auto 16px; }

        .item-editor { max-width: 720px; margin: 0 auto; padding: 32px; padding-bottom: 100px; }
        .item-header { margin-bottom: 24px; }
        .item-title-input { width: 100%; background: transparent; border: none; font-size: 28px; font-weight: 700; color: var(--text-primary); padding: 0; letter-spacing: -0.5px; }
        .item-title-input:focus { outline: none; }
        .item-body-input { width: 100%; background: transparent; border: none; font-size: 16px; color: var(--text-primary); line-height: 1.7; min-height: 400px; resize: none; padding: 0; }
        .item-body-input:focus { outline: none; }
        .meta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
        .tag { display: inline-flex; align-items: center; gap: 4px; background: var(--bg-surface); padding: 4px 8px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); }
        
        .layer-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
        .layer-header-info { flex: 1; }
        .layer-header h1 { font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .layer-header p { color: var(--text-secondary); margin-top: 4px; }
        
        .login-overlay { background: var(--bg-base); background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1), transparent 60%); position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .login-card { max-width: 400px; width: 100%; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); text-align: center; }
        .login-logo { font-weight: 700; font-size: 24px; letter-spacing: -0.5px; margin-bottom: 24px; }
        .login-logo span { color: var(--accent-blue); }

        .pwa-banner { position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 360px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 16px; z-index: 150; display: flex; gap: 12px; align-items: center; animation: slideUp 300ms ease; }
        .pwa-banner-icon { width: 40px; height: 40px; background: var(--bg-surface); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .pwa-banner-text { flex: 1; }
        .pwa-banner-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .pwa-banner-desc { font-size: 12px; color: var(--text-muted); }
        .pwa-banner-actions { display: flex; flex-direction: column; gap: 4px; }

        .offline-indicator { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(248, 113, 113, 0.9); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; z-index: 200; display: none; box-shadow: var(--shadow-md); }

        .model-search-container { position: relative; margin-bottom: 8px; }
        .model-search-results { max-height: 200px; overflow-y: auto; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); background: var(--bg-surface); }
        .model-item { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .model-item:hover { background: var(--bg-hover); }
        .model-item-name { font-size: 13px; font-weight: 500; }
        .model-item-id { font-size: 11px; color: var(--text-muted); }
        .model-item.selected { background: var(--accent-glow); }

        .creator-card { text-align: center; }
        .creator-img { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 16px; display: block; object-fit: cover; border: 2px solid var(--border-strong); box-shadow: var(--shadow-md); }
        .social-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .social-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-surface); color: var(--text-primary); transition: all 150ms ease; border: 1px solid var(--border-subtle); }
        .social-btn:hover { background: var(--accent-blue); color: white; transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .social-btn svg { width: 18px; height: 18px; }

        .preview-modal { max-width: 800px; }
        .preview-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .preview-icon { width: 48px; height: 48px; background: var(--bg-surface); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .preview-meta { flex: 1; }
        .preview-filename { font-weight: 600; font-size: 16px; }
        .preview-fileinfo { font-size: 12px; color: var(--text-muted); }
        .preview-content { background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; max-height: 50vh; overflow-y: auto; }

        .markdown-body { font-size: 15px; line-height: 1.7; color: var(--text-primary); }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 24px; margin-bottom: 12px; }
        .markdown-body h1 { font-size: 24px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
        .markdown-body h2 { font-size: 20px; }
        .markdown-body h3 { font-size: 18px; }
        .markdown-body p { margin-bottom: 12px; }
        .markdown-body ul, .markdown-body ol { padding-left: 20px; margin-bottom: 12px; }
        .markdown-body li { margin-bottom: 6px; }
        .markdown-body code { background: var(--bg-surface); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .markdown-body pre { background: var(--bg-base); border: 1px solid var(--border-subtle); padding: 12px; border-radius: var(--radius-sm); overflow-x: auto; }
        .markdown-body pre code { background: none; padding: 0; }
        .markdown-body blockquote { border-left: 4px solid var(--accent-blue); padding-left: 12px; color: var(--text-secondary); margin: 12px 0; }
        .markdown-body a { color: var(--accent-blue); text-decoration: underline; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border-subtle); padding: 8px 12px; text-align: left; }
        .markdown-body th { background: var(--bg-surface); font-weight: 600; }

        .graph-container { width: 100%; height: 60vh; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); position: relative; overflow: hidden; }
        .graph-svg { width: 100%; height: 100%; }

        @media (max-width: 1024px) {
            body { grid-template-columns: 1fr; }

<script>
const App = {
    config: {
        DB_NAME: 'layer_db',
        DB_VERSION: 1,
        OPENROUTER_URL: 'https://openrouter.ai/api/v1'
    },
    state: {
        db: null,
        currentView: 'home',
        currentLayerId: null,
        currentItemId: null,
        currentConversationId: null,
        currentContextKey: '',
        generalConversationId: null,
        contextTab: 'ai',
        settings: {},
        abortController: null,
        activeAIRequestId: null,
        aiBusy: false,
        cache: {},
        user: null,
        deferredPrompt: null
    },
    
    async init() {
        this.PWA.init();
        this.Auth.init();
        if (!this.state.user) { this.UI.showLogin(); return; }
        try {
            await this.DB.init();
        } catch (error) {
            console.error('Layer could not open its local database:', error);
            this.UI.showFatalError('Layer could not open local storage. Please enable IndexedDB and reload the page.');
            return;
        }
        await this.loadSettings();
        this.Router.init();
        this.Events.bindGlobal();
        await this.UI.render();
        this.checkOnboarding();
    },

    checkOnboarding() {
        if (!this.state.settings.onboarded) { this.UI.showOnboarding(); }
    },

    PWA: {
        init() {
            if (this._initialized) return;
            this._initialized = true;
            this.setupManifest();
            this.setupInstallPrompt();
            this.setupOfflineIndicator();
            this.setupServiceWorker();
        },
        setupManifest() {
            // Keep the manifest and icon inside this HTML file. Browsers may impose
            // stricter installability rules on data: manifests; when that happens,
            // placing manifest.webmanifest and the icons beside this file is supported.
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#b)"/><path d="M256 88 408 176 256 264 104 176 256 88Z" fill="none" stroke="url(#a)" stroke-width="28" stroke-linejoin="round"/><path d="m104 256 152 88 152-88M104 336l152 88 152-88" fill="none" stroke="url(#a)" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/><circle cx="256" cy="176" r="14" fill="#f5f5f7"/></svg>`;
            const iconUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
            const manifest = {
                name: 'Layer — Agentic Context Workspace',
                short_name: 'Layer',
                description: 'A private, local-first workspace for organizing context.',
                start_url: './',
                scope: './',
                display: 'standalone',
                orientation: 'any',
                background_color: '#0a0a0b',
                theme_color: '#0a0a0b',
                icons: [{ src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }]
            };
            const link = document.getElementById('pwa-manifest-link');
            if (link) link.href = `data:application/manifest+json;charset=utf-8,${encodeURIComponent(JSON.stringify(manifest))}`;
            const favicon = document.getElementById('pwa-favicon');
            if (favicon) favicon.href = iconUrl;
        },
        isInstalled() {
            return window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true || localStorage.getItem('layer_pwa_installed') === 'true';
        },
        canShowInstallHint() {
            const dismissedAt = Number(localStorage.getItem('layer_pwa_dismissed_at') || 0);
            return !this.isInstalled() && (!dismissedAt || Date.now() - dismissedAt > 7 * 24 * 60 * 60 * 1000);
        },
        setupInstallPrompt() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                App.state.deferredPrompt = e;
                if (this.canShowInstallHint()) App.UI.showInstallBanner();
            });
            window.addEventListener('appinstalled', () => {
                localStorage.setItem('layer_pwa_installed', 'true');
                localStorage.removeItem('layer_pwa_dismissed_at');
                App.UI.hideInstallBanner();
                App.state.deferredPrompt = null;
                App.UI.showSnackbar('Layer installed successfully!');
            });
            // Some browsers do not expose beforeinstallprompt. Show a manual-install hint
            // after the app has rendered, while never showing it in standalone mode.
            setTimeout(() => { if (this.canShowInstallHint()) App.UI.showInstallBanner(); }, 1200);
        },
        async doInstall() {
            if (!App.state.deferredPrompt) {
                App.UI.showSnackbar('Use your browser menu and choose “Install Layer” or “Add to Home Screen”.');
                return;
            }
            App.state.deferredPrompt.prompt();
            const { outcome } = await App.state.deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                localStorage.setItem('layer_pwa_installed', 'true');
                localStorage.removeItem('layer_pwa_dismissed_at');
            } else {
                localStorage.setItem('layer_pwa_dismissed_at', String(Date.now()));
            }
            App.UI.hideInstallBanner();
            App.state.deferredPrompt = null;
        },
        dismissInstall() {
            localStorage.setItem('layer_pwa_dismissed_at', String(Date.now()));
            App.UI.hideInstallBanner();
        },
        setupOfflineIndicator() {
            const indicator = document.getElementById('offline-indicator');
            const updateStatus = () => { indicator.style.display = navigator.onLine ? 'none' : 'block'; };
            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);
            updateStatus();
        },
        setupServiceWorker() {
            if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
            // A service worker must be a same-origin file; browsers do not allow a
            // blob/data URL worker. The single-file wrapper therefore registers the
            // optional adjacent service-worker.js when it is present and fails safely
            // when this HTML is deployed alone.
            navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                .then(registration => registration.update().catch(() => {}))
                .catch(error => console.info('Optional service worker unavailable in single-file mode:', error));
        }
    },

    Auth: {
        init() {
            try {
                const user = localStorage.getItem('layer_user');
                if (user) App.state.user = JSON.parse(user);
            } catch (error) {
                console.warn('Ignoring invalid saved login:', error);
                localStorage.removeItem('layer_user');
                App.state.user = null;
            }
        },
        getUsers() {
            try { return JSON.parse(localStorage.getItem('layer_users') || '{}') || {}; }
            catch { return {}; }
        },
        sha256Fallback(input) {
            // SHA-256 fallback for HTTP/LAN deployments where crypto.subtle is unavailable.
            const K = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];
            const bytes = new TextEncoder().encode(String(input));
            const paddedLength = Math.ceil((bytes.length + 9) / 64) * 64;
            const message = new Uint8Array(paddedLength);
            message.set(bytes);
            message[bytes.length] = 0x80;
            const view = new DataView(message.buffer);
            const bitLength = bytes.length * 8;
            view.setUint32(paddedLength - 8, Math.floor(bitLength / 0x100000000), false);
            view.setUint32(paddedLength - 4, bitLength >>> 0, false);
            let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
            let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
            const rotr = (x, n) => (x >>> n) | (x << (32 - n));
            for (let offset = 0; offset < paddedLength; offset += 64) {
                const w = new Uint32Array(64);
                for (let i = 0; i < 16; i++) w[i] = view.getUint32(offset + i * 4, false);
                for (let i = 16; i < 64; i++) {
                    const x = w[i - 15], y = w[i - 2];
                    const s0 = rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3);
                    const s1 = rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10);
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                }
                let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
                for (let i = 0; i < 64; i++) {
                    const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const temp1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
                    const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const temp2 = (S0 + maj) >>> 0;
                    h = g; g = f; f = e; e = (d + temp1) >>> 0;
                    d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
                }
                h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
                h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
            }
            return [h0, h1, h2, h3, h4, h5, h6, h7].map(n => n.toString(16).padStart(8, '0')).join('');
        },
        async hashPassword(password, salt) {
            const input = `${salt}:${password}`;
            const webCrypto = globalThis.crypto;
            if (webCrypto?.subtle?.digest) {
                const bytes = new TextEncoder().encode(input);
                const digest = await webCrypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
            }
            return this.sha256Fallback(input);
        },
        async register(username, password) {
            username = String(username || '').trim();
            if (!username || !password) return { success: false, error: 'Username and password required' };
            if (username.length > 80 || password.length < 8) return { success: false, error: 'Use a username of at most 80 characters and a password of at least 8 characters.' };
            const users = this.getUsers();
            if (users[username]) return { success: false, error: 'User already exists' };
            const salt = App.utils.uuid();
            users[username] = { salt, hash: await this.hashPassword(password, salt) };
            localStorage.setItem('layer_users', JSON.stringify(users));
            return this.login(username, password);
        },
        async login(username, password) {
            username = String(username || '').trim();
            if (!username || !password) return { success: false, error: 'Username and password required' };
            const users = this.getUsers();
            const record = users[username];
            let valid = false;
            if (record?.hash && record?.salt) valid = record.hash === await this.hashPassword(password, record.salt);
            else if (record?.password) {
                // One-time compatibility for accounts created by the original build.
                try { valid = record.password === btoa(unescape(encodeURIComponent(password))); } catch { valid = false; }
                if (valid) {
                    const salt = App.utils.uuid();
                    users[username] = { salt, hash: await this.hashPassword(password, salt) };
                    localStorage.setItem('layer_users', JSON.stringify(users));
                }
            }
            if (!valid) return { success: false, error: 'Invalid credentials' };
            const user = { username };
            App.state.user = user;
            localStorage.setItem('layer_user', JSON.stringify(user));
            return { success: true };
        },
        logout() {
            localStorage.removeItem('layer_user');
            App.state.user = null;
            location.reload();
        }
    },

    utils: {
        uuid() { return globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; const v = c == 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); },
        formatTime(ts) { return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); },
        formatDay(ts) { return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }); },
        escapeHtml(str) { if(!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; },
        debounce(fn, delay) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); }; },
        isValidUrl(str) { try { new URL(str); return true; } catch { return false; } },
        isSafeUrl(str) { try { const u = new URL(str, window.location.href); return ['http:', 'https:', 'mailto:'].includes(u.protocol); } catch { return false; } },
        normalizeExternalUrl(value) {
            let raw = String(value ?? '').trim();
            if (!raw) return '';
            if (/^(?:www\.)/i.test(raw) || /^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}(?:[/:?#]|$)/i.test(raw)) raw = `https://${raw}`;
            try {
                const url = new URL(raw);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
            } catch { return ''; }
        },
        escapeAttr(str) { return this.escapeHtml(String(str ?? '')).replace(/'/g, '&#39;'); },
        safeColor(value, fallback = '#3b82f6') { return /^#[0-9a-f]{3,8}$/i.test(String(value || '')) ? value : fallback; },
        
        normalizeAIItem(args, fallbackLayerId = null) {
            const source = (args && typeof args === 'object') ? args : {};
            const requestedType = String(source.type || 'note').toLowerCase();
            const rawContent = source.content ?? source.body ?? source.description ?? source.text ?? '';
            const rawUrl = source.url ?? source.href ?? source.link ?? (requestedType === 'link' ? rawContent : '');
            const url = requestedType === 'link' ? this.normalizeExternalUrl(rawUrl) : '';
            const safeType = ['note', 'task', 'idea', 'link', 'file'].includes(requestedType) && (requestedType !== 'link' || url) ? requestedType : (requestedType === 'link' ? 'note' : 'note');
            const metadata = (source.metadata && typeof source.metadata === 'object' && !Array.isArray(source.metadata)) ? { ...source.metadata } : {};
            if (safeType === 'task' && !metadata.status) metadata.status = 'todo';
            if (safeType === 'task' && !metadata.priority) metadata.priority = source.priority || 'medium';
            if (url) metadata.url = url;
            if (requestedType === 'link' && !url) metadata.linkError = 'No valid http(s) URL was supplied; saved as a note instead.';
            const requestedLayerId = source.layerIds?.[0] || source.layerId || fallbackLayerId || null;
            return {
                type: safeType,
                title: String(source.title ?? source.name ?? source.filename ?? 'Untitled'),
                content: String(safeType === 'link' ? (rawContent && String(rawContent).trim() !== url ? rawContent : url) : rawContent),
                metadata,
                layerId: requestedLayerId === 'ACTIVE_LAYER_ID' ? App.state.currentLayerId : requestedLayerId
            };
        },
        getItemUrl(item) {
            if (!item || item.type !== 'link') return '';
            return this.normalizeExternalUrl(item.metadata?.url || item.content || '');
        },
        parseActions(raw) {
            if (typeof raw !== 'string') return { actions: null, error: 'Action payload was not text.' };
            let json = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
            let parsed;
            try {
                parsed = JSON.parse(json);
            } catch (firstError) {
                const start = json.indexOf('[');
                const end = json.lastIndexOf(']');
                if (start < 0 || end <= start) return { actions: null, error: 'Action JSON is incomplete or malformed.' };
                try { parsed = JSON.parse(json.slice(start, end + 1)); }
                catch { return { actions: null, error: 'Action JSON is incomplete or malformed.' }; }
            }
            if (!Array.isArray(parsed)) return { actions: null, error: 'Action payload must be a JSON array.' };
            const allowedTools = new Set(['createLayer', 'createItem', 'createItems', 'updateItem', 'deleteItem', 'connectLayers', 'addItemToLayer', 'searchLayer', 'searchGlobal', 'createFile', 'searchWeb']);
            const actions = parsed.filter(action => action && typeof action.tool === 'string' && allowedTools.has(action.tool) && action.args && typeof action.args === 'object' && !Array.isArray(action.args));
            if (actions.length === 0 && parsed.length > 0) return { actions: null, error: 'No valid actions were found in the payload.' };
            return { actions, invalidCount: parsed.length - actions.length, error: null };
        },
        extractActions(text) {
            const source = String(text || '');
            const open = /<actions\b[^>]*>/i.exec(source);
            if (!open) return { text: source.trim(), actions: null, error: null };
            const closePattern = /<\/actions\s*>/ig;
            closePattern.lastIndex = open.index + open[0].length;
            const close = closePattern.exec(source);
            if (!close) return { text: source.replace(open[0], '').trim(), actions: null, error: 'The AI action block was not closed.' };
            const payload = source.slice(open.index + open[0].length, close.index);
            const parsed = this.parseActions(payload);
            const cleaned = `${source.slice(0, open.index)}${source.slice(close.index + close[0].length)}`.trim();
            return { text: cleaned, actions: parsed.actions, invalidCount: parsed.invalidCount || 0, error: parsed.error };
        },
        parseMarkdown(md) {
            if (!md) return '';
            let html = App.utils.escapeHtml(String(md));
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
                const decoded = href.replace(/&amp;/g, '&').replace(/&quot;/g, '"');
                try {
                    const safeHref = App.utils.isSafeUrl(decoded) ? new URL(decoded, window.location.href).href : '';
                    return safeHref ? `<a href="${App.utils.escapeAttr(safeHref)}" target="_blank" rel="noopener noreferrer">${label}</a>` : label;
                } catch { return label; }
            });
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
            html = html.replace(/^\s*[-*] (.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
            html = html.replace(/^\d+\.\s+(.*$)/gim, '<li>$1</li>');
            html = html.split(/\n\n+/).map(p => {
                if (/^<(h[1-3]|pre|blockquote|ul|ol)/.test(p)) return p;
                return `<p>${p.replace(/\n/g, '<br>')}</p>`;
            }).join('\n');
            return html;
        }
    },

    DB: {
        db: null,
        async init() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(App.config.DB_NAME, App.config.DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('layers')) db.createObjectStore('layers', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('itemLayers')) db.createObjectStore('itemLayers', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('layerRelations')) db.createObjectStore('layerRelations', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                    if (!db.objectStoreNames.contains('aiConversations')) db.createObjectStore('aiConversations', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('aiMessages')) db.createObjectStore('aiMessages', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { this.db = e.target.result; App.state.db = this.db; resolve(); };
                req.onerror = (e) => reject(e.target.error);
            });
        },
        tx(store, mode = 'readonly') { return this.db.transaction(store, mode).objectStore(store); },
        async get(store, key) { const t = await this.tx(store); return new Promise(r => { const req = t.get(key); req.onsuccess = () => r(req.result); req.onerror = () => r(null); }); },
        async getAll(store) { const t = await this.tx(store); return new Promise(r => { const req = t.getAll(); req.onsuccess = () => r(req.result || []); req.onerror = () => r([]); }); },
        async put(store, val) { const t = await this.tx(store, 'readwrite'); return new Promise(r => { const req = t.put(val); req.onsuccess = () => r(val); req.onerror = () => r(null); }); },
        async delete(store, key) { const t = await this.tx(store, 'readwrite'); return new Promise(r => { const req = t.delete(key); req.onsuccess = () => r(true); req.onerror = () => r(false); }); },
        async clear(store) { const t = await this.tx(store, 'readwrite'); return new Promise(r => { const req = t.clear(); req.onsuccess = () => r(true); req.onerror = () => r(false); }); }
    },

    Search: {
        async query(q) {
            if(!q || q.trim() === '') return [];
            const term = q.toLowerCase();
            const results = [];
            const layers = await App.DB.getAll('layers');
            layers.forEach(l => {
                if(l.name.toLowerCase().includes(term) || (l.description && l.description.toLowerCase().includes(term))) {
                    results.push({ type: 'layer', id: l.id, title: l.name, desc: l.description, timestamp: l.updatedAt });
                }
            });
            const items = await App.DB.getAll('items');
            items.forEach(it => {
                let matched = false;
                let desc = '';
                if(it.title.toLowerCase().includes(term)) { matched = true; desc = it.content || ''; }
                else if(it.content && it.content.toLowerCase().includes(term)) { matched = true; desc = it.content; }
                if(matched) results.push({ type: it.type, id: it.id, title: it.title, desc: desc.substring(0, 100), timestamp: it.updatedAt });
            });
            return results.sort((a,b) => b.timestamp - a.timestamp);
        }
    },

        async searchWeb(query) {
            let resultsText = [];
            let foundUrls = [];
            
            try {
                const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
                const data = await res.json();
                if (data.AbstractText) resultsText.push(data.AbstractText);
                if (data.AbstractURL) foundUrls.push(data.AbstractURL);
                if (data.RelatedTopics) {
                    data.RelatedTopics.slice(0, 5).forEach(t => {
                        if (t.Text) resultsText.push(t.Text);
                        if (t.FirstURL) foundUrls.push(t.FirstURL);
                        else if (t.Topics && t.Topics[0]) {
                            if (t.Topics[0].Text) resultsText.push(t.Topics[0].Text);
                            if (t.Topics[0].FirstURL) foundUrls.push(t.Topics[0].FirstURL);
                        }
                    });
                }
            } catch(e) { console.log("DuckDuckGo search failed:", e); }
            
            if (resultsText.length === 0) {
                try {
                    const searchTerms = query.split(' ').slice(0, 3).join('_');
                    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(searchTerms)}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.extract) resultsText.push(`Wikipedia: ${data.extract}`);
                        if (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) {
                            foundUrls.push(data.content_urls.desktop.page);
                        }
                    }
                } catch(e) { console.log("Wikipedia summary failed:", e); }
            }
            
            if (resultsText.length === 0) {
                try {
                    const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=3`);
                    const data = await res.json();
                    if (data.query && data.query.search) {
                        data.query.search.forEach(s => {
                            const cleanSnippet = s.snippet.replace(/<[^>]*>/g, '');
                            resultsText.push(`${s.title}: ${cleanSnippet}`);
                        });
                    }
                } catch(e) { console.log("Wikipedia search failed:", e); }
            }
            
            let finalOutput = resultsText.join('\n\n');
            if (foundUrls.length > 0) {
                finalOutput += `\n\n--- REAL URLS FOUND ---\n`;
                [...new Set(foundUrls)].slice(0, 5).forEach(u => finalOutput += `- ${u}\n`);
            } else {
                finalOutput += `\n\n(No specific real URLs found in search results. Please search again or use your best judgment for URLs, but prefer not creating link items if you can't verify them).`;
            }
            
            return finalOutput || `No specific web results found for "${query}".`;
        },

                    context += `ACTIVE_LAYER_ID: ${layer.id}\n`;
                    context += `ACTIVE_LAYER_NAME: ${layer.name}\n`;
                    context += `ACTIVE_LAYER_DESCRIPTION: ${layer.description || 'N/A'}\n`;
                    
                    const items = App.state.cache.items?.filter(i => App.state.cache.itemLayers?.some(il => il.itemId === i.id && il.layerId === layerId));
                    if(items && items.length) {
                        context += "RELEVANT_ITEMS_IN_ACTIVE_LAYER:\n";
                        items.slice(0, 8).forEach(it => {
                            context += `- ID: ${it.id} | Type: ${App.utils.escapeHtml(it.type.toUpperCase())} | Title: ${App.utils.escapeHtml(it.title)} | Content: ${(it.content || '').substring(0, 100)}\n`;
                        });
                    }
                }
            } else {
                context += `ACTIVE_LAYER_ID: null\n`;
                context += `ACTIVE_LAYER_NAME: null\n`;

                if(!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    const errMsg = errData.error?.message || errData.error || `Request failed with status ${res.status}`;
                    releaseRequest();
                    await onError(errMsg);
                    return;
                }

                if (!res.body || typeof res.body.getReader !== 'function') { releaseRequest(); await onError('The AI response did not include a readable stream.'); return; }
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                const processSseLine = (line) => {
                    if (!line.startsWith('data:')) return;
                    const json = line.slice(5).trim();
                    if (!json) return;
                    if (json === '[DONE]') { sawDoneSignal = true; return; }
                    try {
                        const parsed = JSON.parse(json);
                        const delta = parsed.choices?.[0]?.delta?.content;
                        if (typeof delta === 'string' && delta) { fullText += delta; onChunk(delta); resetRequestTimeout(); }
                    } catch (error) { console.debug('Skipping malformed AI stream chunk:', error); }
                };
                while(true) {
                    const { done, value } = await reader.read();
                    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                    const lines = buffer.split(/\r?\n/);
                    buffer = lines.pop() || '';
                    lines.forEach(processSseLine);
                    if(done) break;
                }
                if (buffer.trim()) processSseLine(buffer.trim());

                const actionResult = App.utils.extractActions(fullText);

                if (Array.isArray(actionResult.actions) && actionResult.actions.length > 0) {
                    await onAction(actionResult.actions);
                }
                let cleanedText = actionResult.text;
                if (actionResult.error) {
                    console.warn('AI action block was not accepted:', actionResult.error);
                    cleanedText = `${cleanedText}${cleanedText ? '\n\n' : ''}I could not safely parse the proposed actions. Please try again.`;
                }
                if (!sawDoneSignal && cleanedText) {
                    cleanedText += '\n\n> The response ended unexpectedly. You can retry safely.';
                }
                releaseRequest();
                if (!cleanedText && (!actionResult.actions || actionResult.actions.length === 0)) {
                    await onError(actionResult.error || 'The AI returned an empty response. Please try again.', fullText);
                } else {
                    await onDone(cleanedText || 'Please review the proposed actions.');
                }
            } catch(err) {
                releaseRequest();
                const partial = fullText ? App.utils.extractActions(fullText).text : '';
                if(err.name === 'AbortError') await onError('Generation stopped. The partial response was preserved; you can retry.', partial);
                else await onError(err.message || 'An unknown network error occurred.', partial);
            } finally {
                clearTimeout(requestTimeout);
                releaseRequest();
            }
        }
    },

    Data: {
        async export() {
            const data = {
                layers: await App.DB.getAll('layers'),
                items: await App.DB.getAll('items'),
                itemLayers: await App.DB.getAll('itemLayers'),
                layerRelations: await App.DB.getAll('layerRelations'),
                settings: (await App.DB.getAll('settings')).filter(s => s.key !== 'openrouterKey'),
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `layer-export-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        },
        async import(jsonStr, mode = 'merge') {
            try {
                const data = JSON.parse(jsonStr);
                if(mode === 'replace') {
                    await App.DB.clear('layers'); await App.DB.clear('items');
                    await App.DB.clear('itemLayers'); await App.DB.clear('layerRelations');
                }
                if(data.layers) for(const l of data.layers) await App.DB.put('layers', l);
                if(data.items) for(const i of data.items) await App.DB.put('items', i);
                if(data.itemLayers) for(const il of data.itemLayers) await App.DB.put('itemLayers', il);
                if(data.layerRelations) for(const r of data.layerRelations) await App.DB.put('layerRelations', r);
                return true;
            } catch(e) { return false; }
        }
    },

    Router: {
        init() {
            if (this._initialized) return;
            this._initialized = true;
            window.addEventListener('hashchange', () => App.Router.handle());
            this.handle();
        },
        handle() {
            const hash = window.location.hash.slice(1) || 'home';
            const parts = hash.split('/');
            const requestedView = ['home', 'layers', 'layer', 'items', 'item', 'search', 'ai', 'settings'].includes(parts[0]) ? parts[0] : 'home';
            App.state.currentView = requestedView;
            App.state.currentLayerId = parts[1] === 'layer' ? parts[2] : null;
            App.state.currentItemId = parts[1] === 'item' ? parts[2] : null;
            if(parts[1] === 'layer') App.state.currentView = 'layer';
            if(parts[1] === 'item') App.state.currentView = 'item';
            const contextKey = `${App.state.currentLayerId || ''}:${App.state.currentItemId || ''}`;
            if (contextKey !== App.state.currentContextKey) {
                App.state.currentContextKey = contextKey;
                App.state.currentConversationId = null;
            }
            App.UI.closeModals();
            App.UI.render();
        },
        navigate(view, id = null) {
            let hash = view;
            if(view === 'layer' && id) hash = `layer/layer/${id}`;
            else if(view === 'item' && id) hash = `item/item/${id}`;
            window.location.hash = hash;
        }
    },

    Events: {
        bindGlobal() {
            if (this._initialized) return;
            this._initialized = true;

            document.addEventListener('keydown', (e) => {
                if((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); App.UI.openCommandPalette(); }
                if(e.key === 'q' && (!e.target || !e.target.matches || !e.target.matches('input, textarea, [contenteditable]'))) { e.preventDefault(); App.UI.openQuickCapture(); }
                if((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'Space') { e.preventDefault(); App.UI.openQuickCapture(); }
                if(e.key === 'Escape') { App.UI.closeModals(); }
            });

            document.querySelectorAll('[data-nav]').forEach(btn => {
                btn.addEventListener('click', () => {
                    App.Router.navigate(btn.dataset.nav);
                    document.getElementById('sidebar').classList.remove('open');
                });
            });

            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('context-panel').classList.remove('open');
            });
            document.getElementById('mobile-ctx-btn').addEventListener('click', () => {
                document.getElementById('context-panel').classList.toggle('open');
                document.getElementById('sidebar').classList.remove('open');
            });
            
            document.getElementById('quick-capture-btn').addEventListener('click', () => App.UI.openQuickCapture());

            document.querySelectorAll('.ctx-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    App.state.contextTab = btn.dataset.ctxTab;
                    App.UI.renderContextPanel();
                });
            });

            document.addEventListener('click', (e) => {
                const menuRoot = document.getElementById('ctx-menu-root');
                if (menuRoot && !menuRoot.contains(e.target)) {
                    menuRoot.innerHTML = '';
                }
            });

            document.getElementById('main-content').addEventListener('click', (e) => {
                if (window.innerWidth <= 1024) {
                    const sidebar = document.getElementById('sidebar');
                    const ctxPanel = document.getElementById('context-panel');
                    if (!sidebar.contains(e.target) && e.target.id !== 'mobile-menu-btn') {
                        sidebar.classList.remove('open');
                    }
                    if (!ctxPanel.contains(e.target) && e.target.id !== 'mobile-ctx-btn') {
                        ctxPanel.classList.remove('open');
                    }
                }
            });
        }
    },

            renderItemCard(it) {
                let metaHtml = '';
                if(it.type === 'task') {
                    metaHtml = `<select class="input" style="width: auto; padding: 2px 4px; font-size: 11px; margin: 0; height: auto; background: var(--bg-surface); border: 1px solid var(--border-subtle);" onchange="App.UI.updateTaskStatus('${it.id}', this.value); event.stopPropagation();">
                        <option value="todo" ${(it.metadata || {}).status==='todo'?'selected':''}>To Do</option>
                        <option value="progress" ${(it.metadata || {}).status==='progress'?'selected':''}>In Progress</option>
                        <option value="done" ${(it.metadata || {}).status==='done'?'selected':''}>Done</option>
                    </select>`;
                } else if(it.type === 'idea') {
                    metaHtml = `<span class="badge">Idea</span>`;
                } else if(it.type === 'file') {
                    metaHtml = `<span class="badge">${App.utils.escapeHtml(it.metadata?.filename?.split('.').pop() || 'file')}</span>`;
                }
                const itemUrl = App.utils.getItemUrl(it);
                const linkHtml = it.type === 'link' ? (itemUrl
                    ? `<a class="btn btn-ghost text-xs" href="${App.utils.escapeAttr(itemUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Open link ↗</a>`
                    : `<span class="text-xs text-muted">No valid URL</span>`) : '';
                return `<div class="card" onclick="App.Router.navigate('item', '${it.id}')" oncontextmenu="App.UI.showCtxMenu(event, 'item', '${it.id}')">
                    <div class="card-title">${this.icons()[it.type]} ${App.utils.escapeHtml(it.title)}</div>
                    <div class="card-desc">${App.utils.escapeHtml(it.content || 'No content')}</div>
                    <div class="card-meta"><div>${metaHtml}</div>${linkHtml}<span>${App.utils.formatTime(it.updatedAt)}</span></div>
                </div>`;
            }
        },

        async renderContextPanel() {
            const header = document.getElementById('ctx-info');
            const content = document.getElementById('ctx-content');
            const footer = document.getElementById('ctx-footer');
            
            document.querySelectorAll('.ctx-tab').forEach(t => t.classList.toggle('active', t.dataset.ctxTab === App.state.contextTab));

            header.innerHTML = '';
            content.innerHTML = '';
            footer.innerHTML = '';

            if(App.state.contextTab === 'info') {
                if(App.state.currentLayerId) {
                    const l = await App.Layers.get(App.state.currentLayerId);
                    if (!l) { content.innerHTML = '<p class="text-muted text-sm">This Layer no longer exists.</p>'; return; }
                    header.innerHTML = `<strong>${App.utils.escapeHtml(l.name)}</strong>`;
                    const items = await App.Items.getByLayer(l.id);
                    const conns = await App.Relations.getConnectedLayers(l.id);
                    content.innerHTML = `<div class="flex flex-col gap-4">
                        <div><h4 class="text-xs text-muted mb-2">DESCRIPTION</h4><p class="text-sm">${App.utils.escapeHtml(l.description || 'N/A')}</p></div>
                        <div><h4 class="text-xs text-muted mb-2">ITEMS (${items.length})</h4><div class="flex flex-col gap-1">${items.slice(0,5).map(i => `<div class="text-sm" style="padding: 4px 0; border-bottom: 1px solid var(--border-subtle)">${App.utils.escapeHtml(i.title)}</div>`).join('') || 'None'}</div></div>
                        <div><h4 class="text-xs text-muted mb-2">CONNECTIONS (${conns.length})</h4><div class="flex flex-col gap-1">${conns.map(c => `<div class="text-sm">${App.utils.escapeHtml(c.name)}</div>`).join('') || 'None'}</div></div>
                    </div>`;
                } else if(App.state.currentItemId) {
                    const it = await App.Items.get(App.state.currentItemId);
                    if (!it) { content.innerHTML = '<p class="text-muted text-sm">This Item no longer exists.</p>'; return; }
                    const layers = await App.Relations.getLayersForItem(it.id);
                    header.innerHTML = `<strong>${App.utils.escapeHtml(it.title)}</strong>`;
                    content.innerHTML = `<div class="flex flex-col gap-4">
                        <div><h4 class="text-xs text-muted mb-2">TYPE</h4><p class="text-sm">${App.utils.escapeHtml(it.type)}</p></div>
                        <div><h4 class="text-xs text-muted mb-2">LAYERS (${layers.length})</h4><div class="flex flex-col gap-1">${layers.map(l => `<div class="text-sm">${App.utils.escapeHtml(l.name)}</div>`).join('') || 'None'}</div></div>
                    </div>`;
                } else {
                    content.innerHTML = `<p class="text-muted text-sm">Select a Layer or Item to see context.</p>`;
                }
            } else {
                if(App.state.currentLayerId) header.innerHTML = `Context: ${(await App.Layers.get(App.state.currentLayerId))?.name || ''}`;
                else if(App.state.currentItemId) header.innerHTML = `Context: ${(await App.Items.get(App.state.currentItemId))?.title || ''}`;
                else header.innerHTML = `Global Assistant`;
                
                if(!App.state.settings.openrouterKey) {
                    content.innerHTML = `<div class="empty-state" style="padding: 24px 0;"><p class="text-sm text-muted mb-4">Configure OpenRouter to enable AI.</p><button class="btn btn-primary" onclick="App.Router.navigate('settings')">Settings</button></div>`;
                    return;
                }

                if(!App.state.currentConversationId) {
                    App.state.currentConversationId = App.utils.uuid();
                    await App.DB.put('aiConversations', { id: App.state.currentConversationId, layerId: App.state.currentLayerId, itemId: App.state.currentItemId, createdAt: Date.now() });
                }
                
                const msgs = (await App.DB.getAll('aiMessages')).filter(m => m.conversationId === App.state.currentConversationId).sort((a,b) => a.createdAt - b.createdAt);
                
                let html = `<div id="ai-messages" class="flex flex-col gap-4">`;
                if(msgs.length === 0) {
                    html += `<div class="ai-suggestions">
                        <button class="ai-suggestion" onclick="App.UI.askAI('Summarize this Layer')">Summarize this context</button>
                        <button class="ai-suggestion" onclick="App.UI.askAI('What should I work on next?')">What should I work on next?</button>
                        <button class="ai-suggestion" onclick="App.UI.askAI('Create a study plan for this layer with 5 tasks.')">Create a study plan</button>
                    </div>`;
                } else {
                    msgs.forEach(m => {
                        if (m.role === 'system') return; // Hide system messages from UI
                        html += `<div class="ai-msg ai-msg-${m.role}">
                            <div class="ai-msg-role">${m.role}</div>
                            <div class="ai-msg-content">${App.utils.parseMarkdown(m.content)}</div>
                            ${this.renderActionCard(m.actions, m.id)}
                        </div>`;
                    });
                }
                html += `</div>`;
                content.innerHTML = html;
                content.scrollTop = content.scrollHeight;

                const isGenerating = App.state.aiBusy || App.state.abortController !== null;
                footer.innerHTML = `
                    <div class="flex gap-2">
                        <input type="text" class="input" id="ai-input" placeholder="Ask Layer AI to execute actions..." onkeydown="if(event.key==='Enter' && !App.state.aiBusy && !App.state.abortController) App.UI.sendAI()" ${isGenerating ? 'disabled' : ''}>
                        ${isGenerating ? '<button class="btn btn-danger" onclick="App.UI.cancelAI()">Stop</button>' : '<button class="btn btn-primary" onclick="App.UI.sendAI()">Send</button>'}
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button class="btn btn-ghost text-xs" onclick="App.UI.clearConversation()">Clear</button>
                    </div>
                `;
            }
        },

        showLogin() {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="login-overlay">
                    <div class="login-card">
                        <div class="login-logo">Layer<span>.</span></div>
                        <h3 class="modal-title" style="text-align: center; margin-bottom: 8px;">Welcome back</h3>
                        <p class="text-muted" style="text-align: center; margin-bottom: 24px;">Your context, organized.</p>
                        <div id="login-error" class="text-sm" style="color: #f87171; margin-bottom: 12px; text-align: center; display: none;"></div>
                        <div class="form-group"><input type="text" class="input" id="login-user" placeholder="Username" onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()"></div>
                        <div class="form-group"><input type="password" class="input" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter') App.UI.handleLogin()"></div>
                        <button class="btn btn-primary w-full" style="justify-content: center; margin-bottom: 12px;" onclick="App.UI.handleLogin()">Login</button>
                        <p class="text-sm text-muted" style="text-align: center;">Don't have an account? <a href="#" onclick="App.UI.toggleAuthMode(); return false;" id="auth-mode-link">Register</a></p>

                </div>
            `;

        toggleAuthMode() {
            const link = document.getElementById('auth-mode-link');
            const title = document.querySelector('.login-card .modal-title');
            const btn = document.querySelector('.login-card .btn-primary');
            if (link.textContent === 'Register') { link.textContent = 'Login'; title.textContent = 'Create account'; btn.textContent = 'Register'; }
            else { link.textContent = 'Register'; title.textContent = 'Welcome back'; btn.textContent = 'Login'; }
        },

        async handleLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const isRegister = document.getElementById('auth-mode-link').textContent === 'Login';
            const res = isRegister ? await App.Auth.register(u, p) : await App.Auth.login(u, p);
            if (res.success) { this.closeModals(); await App.init(); }
            else { const err = document.getElementById('login-error'); err.textContent = res.error; err.style.display = 'block'; }
        },
