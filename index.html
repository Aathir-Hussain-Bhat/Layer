        renderGraph(containerId, activeLayer, connectedLayers, items) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const width = container.clientWidth;
            const height = container.clientHeight;
            const cx = width / 2;
            const cy = height / 2;
            
            let svg = `<svg class="graph-svg" viewBox="0 0 ${width} ${height}">`;
            
            connectedLayers.forEach((l, i) => {
                const angle = (i / connectedLayers.length) * 2 * Math.PI;
                const x = cx + Math.cos(angle) * 150;
                const y = cy + Math.sin(angle) * 120;
                svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${App.utils.safeColor(l.accent)}" stroke-width="2" stroke-opacity="0.4" />`;
            });
            
            items.slice(0, 8).forEach((it, i) => {
                const angle = (i / Math.min(8, items.length)) * 2 * Math.PI + Math.PI / 4;
                const x = cx + Math.cos(angle) * 220;
                const y = cy + Math.sin(angle) * 180;
                svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border-subtle)" stroke-width="1" stroke-dasharray="4" />`;
            });
            
            connectedLayers.forEach((l, i) => {
                const angle = (i / connectedLayers.length) * 2 * Math.PI;
                const x = cx + Math.cos(angle) * 150;
                const y = cy + Math.sin(angle) * 120;
                svg += `<g class="node" onclick="App.Router.navigate('layer', '${l.id}')" style="cursor: pointer;">`;
                svg += `<circle cx="${x}" cy="${y}" r="24" fill="${App.utils.safeColor(l.accent)}20" stroke="${App.utils.safeColor(l.accent)}" stroke-width="2" />`;
                svg += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" fill="${App.utils.safeColor(l.accent)}">${App.utils.escapeHtml(l.icon)}</text>`;
                svg += `<text x="${x}" y="${y + 40}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${App.utils.escapeHtml(l.name)}</text>`;
                svg += `</g>`;
            });
            
            items.slice(0, 8).forEach((it, i) => {
                const angle = (i / Math.min(8, items.length)) * 2 * Math.PI + Math.PI / 4;
                const x = cx + Math.cos(angle) * 220;
                const y = cy + Math.sin(angle) * 180;
                svg += `<g class="node" onclick="App.Router.navigate('item', '${it.id}')" style="cursor: pointer;">`;
                svg += `<circle cx="${x}" cy="${y}" r="16" fill="var(--bg-surface)" stroke="var(--border-strong)" stroke-width="1" />`;
                svg += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" fill="var(--text-primary)">${this.Views.icons()[it.type]}</text>`;
                svg += `<text x="${x}" y="${y + 32}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${App.utils.escapeHtml(it.title.substring(0, 15))}...</text>`;
                svg += `</g>`;
            });
            
            svg += `<circle cx="${cx}" cy="${cy}" r="32" fill="${App.utils.safeColor(activeLayer.accent)}30" stroke="${App.utils.safeColor(activeLayer.accent)}" stroke-width="3" />`;
            svg += `<text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="18" fill="${App.utils.safeColor(activeLayer.accent)}">${App.utils.escapeHtml(activeLayer.icon)}</text>`;
            svg += `<text x="${cx}" y="${cy + 50}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-primary)">${App.utils.escapeHtml(activeLayer.name)}</text>`;
            
            svg += `</svg>`;
            container.innerHTML = svg;
        },

        async askAI(prompt) {
            App.state.contextTab = 'ai';
            document.getElementById('context-panel').classList.add('open');
            document.getElementById('sidebar').classList.remove('open');
            await this.renderContextPanel();
            const input = document.getElementById('ai-input');
            if (input) { input.value = prompt; await this.sendAI(); }
            else this.showSnackbar('AI input is unavailable.');
        },
        refreshAIControls() {
            const busy = App.state.aiBusy || App.state.abortController !== null;
            const update = (inputId, sendMethod) => {
                const input = document.getElementById(inputId);
                const row = input?.parentElement;
                const button = row?.querySelector('button');
                if (input) input.disabled = busy;
                if (button) {
                    button.textContent = busy ? 'Stop' : 'Send';
                    button.className = busy ? 'btn btn-danger' : 'btn btn-primary';
                    button.onclick = busy ? () => this.cancelAI() : () => sendMethod();
                }
            };
            update('ai-input', () => this.sendAI());
            update('ai-chat-input', () => this.sendGeneralAI());
        },
        cancelAI() {
            if (App.state.abortController) {
                App.state.abortController.abort();
                this.showSnackbar('Stopping the current AI response...');
            }
        },
        async sendAI(optionalPrompt, isHidden = false) {
            if (App.state.aiBusy || App.state.abortController) {
                return this.showSnackbar('An AI response is active. Use Stop to cancel it, then try again.');
            }

            const input = document.getElementById('ai-input');
            const prompt = optionalPrompt || (input ? input.value.trim() : '');
            if(!prompt) return;
            if (input && !optionalPrompt) input.value = '';
            
            const convId = App.state.currentConversationId;
            const userMsg = { id: App.utils.uuid(), conversationId: convId, role: isHidden ? 'system' : 'user', content: prompt, createdAt: Date.now() };
            await App.DB.put('aiMessages', userMsg);
            await this.renderContextPanel();
            const aiMsgId = App.utils.uuid();
            const aiMsg = { id: aiMsgId, conversationId: convId, role: 'assistant', content: '', createdAt: Date.now(), actions: null };
            await App.DB.put('aiMessages', aiMsg);
            const msgsDiv = document.getElementById('ai-messages');
            if (!msgsDiv) {
                await this.renderContextPanel();
                return this.sendAI(prompt, isHidden);
            }
            const streamElementId = `streaming-${aiMsgId}`;
            const msgEl = document.createElement('div');
            msgEl.className = 'ai-msg ai-msg-assistant';
            msgEl.innerHTML = `<div class="ai-msg-role">assistant</div><div class="ai-msg-content" id="${streamElementId}"><div class="ai-thinking"><span></span><span></span><span></span></div></div>`;
            msgsDiv.appendChild(msgEl);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;
            this.refreshAIControls();

            await App.AI.streamChat(
                prompt, convId, App.state.currentLayerId, App.state.currentItemId,
                (chunk) => {
                    const el = document.getElementById(streamElementId);
                    if(el) {
                        const thinking = el.querySelector('.ai-thinking');
                        if (thinking) thinking.remove();
                        el.innerHTML += App.utils.escapeHtml(chunk).replace(/\n/g, '<br>');
                    }
                    msgsDiv.scrollTop = msgsDiv.scrollHeight;
                },
                async (actions) => {
                    aiMsg.actions = actions;
                    await App.DB.put('aiMessages', aiMsg);
                },
                async (fullText) => {
                    aiMsg.content = fullText;
                    await App.DB.put('aiMessages', aiMsg);
                    if (App.state.contextTab === 'ai') await this.renderContextPanel();
                },
                async (err, partialText = '') => {
                    aiMsg.content = partialText ? `${partialText}\n\n> ${err}` : `Error: ${err}`;
                    await App.DB.put('aiMessages', aiMsg);
                    if (App.state.contextTab === 'ai') await this.renderContextPanel();
                }
            );
        },
        
        renderActionCard(actions, msgId) {
            if (!actions || actions.length === 0) return '';
            
            const groups = {};
            if (!Array.isArray(actions)) return '';
            actions.forEach((a, index) => {
                if (!a || typeof a.tool !== 'string' || !a.args || typeof a.args !== 'object') return;
                let key = a.tool.toUpperCase();
                if (key === 'CREATEITEMS') key = 'CREATE';
                if (!groups[key]) groups[key] = [];

                if (a.tool === 'createItems') {
                    if (!Array.isArray(a.args.items)) return;
                    a.args.items.forEach(item => {
                        if (item && typeof item === 'object') groups[key].push({ desc: `${item.type || 'item'}: ${item.title || 'Untitled'}`, content: item.content });
                    });
                } else {
                    let desc = '';
                    let previewBtn = '';
                    let contentSnippet = '';
                    if (a.tool === 'createItem') {
                        desc = `${a.args.type}: ${a.args.title}`;
                        if (a.args.type === 'link') desc += ` → ${a.args.url || a.args.href || 'URL missing'}`;
                        if (a.args.content) contentSnippet = String(a.args.content).substring(0, 120) + (String(a.args.content).length > 120 ? '...' : '');
                    }
                    else if (a.tool === 'addItemToLayer') desc = `${a.args.itemRef || a.args.itemTitle} -> ${a.args.layerRef || a.args.layerName}`;
                    else if (a.tool === 'createLayer') desc = `Layer: ${a.args.name}`;
                    else if (a.tool === 'connectLayers') desc = `${a.args.layer1Name || a.args.layer1Ref} <-> ${a.args.layer2Name || a.args.layer2Ref}`;
                    else if (a.tool === 'updateItem') desc = `Update: ${a.args.itemTitle || a.args.itemId}`;
                    else if (a.tool === 'deleteItem') desc = `Delete: ${a.args.itemTitle || a.args.itemId}`;
                    else if (a.tool === 'createFile') {
                        const filename = String(a.args.filename || 'generated-file.txt');
                        const ext = filename.split('.').pop().toLowerCase();
                        const size = a.args.content ? a.args.content.length : 0;
                        desc = `File: ${filename} (${ext}, ${size} bytes)`;
                        previewBtn = `<button class="btn btn-ghost text-xs" style="margin-left: auto; padding: 2px 6px;" onclick="App.UI.openFilePreview('${msgId}', ${index})">Preview</button>`;
                    }
                    groups[key].push({ desc, previewBtn, contentSnippet });
                }
            });

            let html = `<div class="ai-action-card">
                <div class="ai-action-title">Layer AI wants to make changes</div>`;
            
            Object.keys(groups).forEach(key => {
                html += `<div class="ai-action-group"><div class="ai-action-group-title">${key}</div>`;
                groups[key].forEach(item => {
                    html += `<div class="ai-action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>${App.utils.escapeHtml(item.desc)}${item.previewBtn || ''}</div>`;
                    if (item.contentSnippet) {
                        html += `<div class="ai-action-item-content">${App.utils.escapeHtml(item.contentSnippet)}</div>`;
                    }
                });
                html += `</div>`;
            });

            html += `<div class="flex gap-2 mt-3">
                <button class="btn btn-ghost" onclick="App.UI.rejectAction('${msgId}')">Cancel</button>
                <button class="btn btn-primary" onclick="App.UI.confirmAction('${msgId}')">Create</button>
            </div></div>`;
            return html;
        },

        async openFilePreview(msgId, actionIndex) {
            const msg = await App.DB.get('aiMessages', msgId);
            if (!msg || !msg.actions) return;
            const action = msg.actions[actionIndex];
            if (!action || action.tool !== 'createFile') return;

            const ext = action.args.filename.split('.').pop().toLowerCase();
            const size = action.args.content ? action.args.content.length : 0;
            const sizeStr = size < 1024 ? `${size} B` : `${(size/1024).toFixed(1)} KB`;
            
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) App.UI.closeModals()">
                    <div class="modal preview-modal">
                        <div class="preview-header">
                            <div class="preview-icon">📄</div>
                            <div class="preview-meta">
                                <div class="preview-filename">${App.utils.escapeHtml(action.args.filename)}</div>
                                <div class="preview-fileinfo">Type: ${App.utils.escapeHtml(ext)} • Size: ${App.utils.escapeHtml(sizeStr)}</div>
                            </div>
                            <button class="icon-btn" onclick="App.UI.closeModals()">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </div>
                        <div class="preview-content">${App.utils.escapeHtml(action.args.content)}</div>
                        <div class="flex justify-end gap-2 mt-4">
                            <button class="btn btn-ghost" onclick="App.UI.closeModals()">Cancel</button>
                            <button class="btn btn-primary" onclick="App.UI.confirmAction('${msgId}')">Create File</button>
                        </div>
                    </div>
                </div>
            `;
        },

        async rejectAction(msgId) {
            const msg = await App.DB.get('aiMessages', msgId);
            if (msg) {
                msg.actions = null;
                msg.content += `\n\n❌ *Action plan rejected.*`;
                await App.DB.put('aiMessages', msg);
                await this.renderContextPanel();
            }
        },

        async openItemLink(itemId) {
            const item = await App.Items.get(itemId);
            const url = App.utils.getItemUrl(item);
            if (!url) return this.showSnackbar('This item does not contain a valid http(s) URL.');
            window.open(url, '_blank', 'noopener,noreferrer');
        },
        async confirmAction(msgId) {
            const msg = await App.DB.get('aiMessages', msgId);
            if (!msg || !msg.actions) return;

            const refs = {};
            let successCount = 0;
            let webSearchAction = null;

            for (const action of msg.actions) {
                try {
                    if (action.tool === 'searchWeb') {
                        webSearchAction = action;
                        continue;
                    }
                    else if (action.tool === 'createLayer') {
                        const l = await App.Layers.create({ 
                            name: action.args.name, 
                            icon: action.args.icon || 'L', 
                            description: action.args.description || '' 
                        });
                        if (action.ref) refs[action.ref] = l.id;
                        successCount++;
                    } else if (action.tool === 'createItem') {
                        const itemData = App.utils.normalizeAIItem(action.args, App.state.currentLayerId);
                        const i = await App.Items.create(itemData.type, itemData);
                        if (action.ref) refs[action.ref] = i.id;
                        successCount++;
                    } else if (action.tool === 'createItems') {
                        if (!Array.isArray(action.args.items)) continue;
                        for (const rawItemData of action.args.items) {
                            const itemData = App.utils.normalizeAIItem({ ...rawItemData, layerIds: rawItemData.layerIds || action.args.layerIds }, App.state.currentLayerId);
                            const i = await App.Items.create(itemData.type, itemData);
                            if (rawItemData.ref) refs[rawItemData.ref] = i.id;
                            successCount++;
                        }
                    } else if (action.tool === 'addItemToLayer') {
                        let itemId = action.args.itemRef ? refs[action.args.itemRef] : null;
                        if (!itemId && action.args.itemTitle) {
                            const items = App.state.cache.items.filter(i => i.title.toLowerCase() === action.args.itemTitle.toLowerCase());
                            if (items.length > 0) itemId = items[0].id;
                        }
                        let layerId = action.args.layerRef ? refs[action.args.layerRef] : null;
                        if (!layerId && action.args.layerName) {
                            const l = App.state.cache.layers.find(l => l.name.toLowerCase() === action.args.layerName.toLowerCase());
                            if (l) layerId = l.id;
                        }
                        if (itemId && layerId) {
                            await App.Relations.addItemToLayer(itemId, layerId);
                            successCount++;
                        }
                    } else if (action.tool === 'connectLayers') {
                        let l1 = action.args.layer1Ref ? refs[action.args.layer1Ref] : null;
                        if (!l1 && action.args.layer1Name) {
                            const l = App.state.cache.layers.find(l => l.name.toLowerCase() === action.args.layer1Name.toLowerCase());
                            if (l) l1 = l.id;
                        }
                        let l2 = action.args.layer2Ref ? refs[action.args.layer2Ref] : null;
                        if (!l2 && action.args.layer2Name) {
                            const l = App.state.cache.layers.find(l => l.name.toLowerCase() === action.args.layer2Name.toLowerCase());
                            if (l) l2 = l.id;
                        }
                        if (l1 && l2) {
                            await App.Relations.connectLayers(l1, l2);
                            successCount++;
                        }
                    } else if (action.tool === 'createFile') {
                        const ext = action.args.filename.split('.').pop().toLowerCase();
                        const size = action.args.content ? action.args.content.length : 0;
                        const layerId = action.args.layerIds?.[0] || action.args.layerId || null;
                        const i = await App.Items.create('file', { 
                            title: action.args.filename, 
                            content: String(action.args.content ?? action.args.body ?? action.args.text ?? ''),
                            metadata: {
                                filename: action.args.filename,
                                filetype: ext,
                                size: size,
                                generatedBy: 'AI'
                            },
                            layerId: layerId
                        });
                        if (action.ref) refs[action.ref] = i.id;
                        successCount++;
                    } else if (action.tool === 'updateItem') {
                        let item = null;
                        if (action.args.itemId) item = await App.Items.get(action.args.itemId);
                        if (!item && action.args.itemTitle) {
                            const items = App.state.cache.items.filter(i => i.title.toLowerCase() === action.args.itemTitle.toLowerCase());
                            if (items.length > 0) item = items[0];
                        }
                        if (item) {
                            const updates = { ...(action.args.updates || {}) };
                            if (action.args.title !== undefined) updates.title = action.args.title;
                            if (action.args.content !== undefined) updates.content = action.args.content;
                            if (action.args.url !== undefined) {
                                const url = App.utils.normalizeExternalUrl(action.args.url);
                                if (url) updates.metadata = { ...(item.metadata || {}), url };
                            }
                            await App.Items.update(item.id, updates);
                            successCount++;
                        }
                    } else if (action.tool === 'deleteItem') {
                        let item = null;
                        if (action.args.itemId) item = await App.Items.get(action.args.itemId);
                        if (!item && action.args.itemTitle) {
                            const items = App.state.cache.items.filter(i => i.title.toLowerCase() === action.args.itemTitle.toLowerCase());
                            if (items.length > 0) item = items[0];
                        }
                        if (item) {
                            await App.Items.delete(item.id);
                            successCount++;
                        }
                    }
                } catch(e) {
                    console.error("Action execution failed", action, e);
                }
            }

            msg.actions = null;
            
            if (webSearchAction) {
                this.showSnackbar(`Searching web for: ${webSearchAction.args.query}...`);
                const results = await App.AI.searchWeb(webSearchAction.args.query);
                msg.content += `\n\n🔄 *Web search completed. Processing results...*`;
                await App.DB.put('aiMessages', msg);
                await this.renderContextPanel();
                
                const convId = msg.conversationId;
                const followUpPrompt = `[SYSTEM_INJECTION] Web Search Results for "${webSearchAction.args.query}":\n\n${results}\n\nPlease fulfill the previous request using these results. If creating links, use the URLs found. Use <actions> block now.`;
                
                if (convId === App.state.generalConversationId) {
                    await this.sendGeneralAI(followUpPrompt, true); // hidden = true
                } else {
                    await this.sendAI(followUpPrompt, true); // hidden = true
                }
                return;
            }
            
            msg.content += `\n\n✅ *${successCount} actions executed successfully.*`;
            await App.DB.put('aiMessages', msg);
            this.showSnackbar(`${successCount} actions executed`);
            await this.render();
            await this.renderContextPanel();
            this.closeModals();
        },

        async clearConversation() {
            const msgs = await App.DB.getAll('aiMessages');
            for(const m of msgs) if(m.conversationId === App.state.currentConversationId) await App.DB.delete('aiMessages', m.id);
            await App.DB.delete('aiConversations', App.state.currentConversationId);
            App.state.currentConversationId = null;
            await this.renderContextPanel();
        },

        async renderGeneralAIMessages() {
            const msgsDiv = document.getElementById('ai-chat-messages');
            if (!msgsDiv) return;
            const msgs = (await App.DB.getAll('aiMessages')).filter(m => m.conversationId === App.state.generalConversationId).sort((a, b) => a.createdAt - b.createdAt);
            msgsDiv.innerHTML = '';
            if (msgs.length === 0) {
                msgsDiv.innerHTML = `<div class="ai-suggestions">
                    <button class="ai-suggestion" onclick="App.UI.askGeneralAI('Create a research layer about CRISPR, add links to 3 papers, and make a task plan.')">Create a CRISPR research layer</button>
                    <button class="ai-suggestion" onclick="App.UI.askGeneralAI('Generate a complete project specification markdown file for my Layer app.')">Generate project specification</button>
                    <button class="ai-suggestion" onclick="App.UI.askGeneralAI('What can you help me with?')">What can you help me with?</button>
                </div>`;
            } else {
                msgs.forEach(m => {
                    if (m.role === 'system') return; // Hide system messages from UI
                    const msgEl = document.createElement('div');
                    msgEl.className = `ai-msg ai-msg-${m.role}`;
                    msgEl.innerHTML = `
                        <div class="ai-msg-role">${m.role}</div>
                        <div class="ai-msg-content">${App.utils.parseMarkdown(m.content)}</div>
                        ${this.renderActionCard(m.actions, m.id)}
                    `;
                    msgsDiv.appendChild(msgEl);
                });
            }
            const container = document.getElementById('ai-chat-container');
            if (container) container.scrollTop = container.scrollHeight;
        },
        async askGeneralAI(prompt) {
            const input = document.getElementById('ai-chat-input');
            if (input) input.value = prompt;
            this.sendGeneralAI();
        },
        async sendGeneralAI(optionalPrompt, isHidden = false) {
            if (App.state.aiBusy || App.state.abortController) {
                return this.showSnackbar('An AI response is active. Use Stop to cancel it, then try again.');
            }

            const input = document.getElementById('ai-chat-input');
            const prompt = optionalPrompt || (input ? input.value.trim() : '');
            if (!prompt) return;
            if (input && !optionalPrompt) input.value = '';
            
            const convId = App.state.generalConversationId;
            const userMsg = { id: App.utils.uuid(), conversationId: convId, role: isHidden ? 'system' : 'user', content: prompt, createdAt: Date.now() };
            await App.DB.put('aiMessages', userMsg);
            await this.renderGeneralAIMessages();
            const aiMsgId = App.utils.uuid();
            const aiMsg = { id: aiMsgId, conversationId: convId, role: 'assistant', content: '', createdAt: Date.now(), actions: null };
            await App.DB.put('aiMessages', aiMsg);
            const msgsDiv = document.getElementById('ai-chat-messages');
            if (!msgsDiv) {
                await this.renderView();
                return this.sendGeneralAI(prompt, isHidden);
            }
            const streamElementId = `streaming-${aiMsgId}`;
            const msgEl = document.createElement('div');
            msgEl.className = 'ai-msg ai-msg-assistant';
            msgEl.innerHTML = `<div class="ai-msg-role">assistant</div><div class="ai-msg-content" id="${streamElementId}"><div class="ai-thinking"><span></span><span></span><span></span></div></div>`;
            msgsDiv.appendChild(msgEl);
            document.querySelector('.main-content').scrollTop = document.querySelector('.main-content').scrollHeight;
            this.refreshAIControls();

            await App.AI.streamChat(
                prompt, convId, null, null,
                (chunk) => {
                    const el = document.getElementById(streamElementId);
                    if(el) {
                        const thinking = el.querySelector('.ai-thinking');
                        if (thinking) thinking.remove();
                        el.innerHTML += App.utils.escapeHtml(chunk).replace(/\n/g, '<br>');
                    }
                    document.querySelector('.main-content').scrollTop = document.querySelector('.main-content').scrollHeight;
                },
                async (actions) => {
                    aiMsg.actions = actions;
                    await App.DB.put('aiMessages', aiMsg);
                },
                async (fullText) => {
                    aiMsg.content = fullText;
                    await App.DB.put('aiMessages', aiMsg);
                    await this.renderGeneralAIMessages();
                },
                async (err, partialText = '') => {
                    aiMsg.content = partialText ? `${partialText}\n\n> ${err}` : `Error: ${err}`;
                    await App.DB.put('aiMessages', aiMsg);
                    await this.renderGeneralAIMessages();
                }
            );
        },
        async clearGeneralConversation() {
            if (!App.state.generalConversationId) return;
            const msgs = await App.DB.getAll('aiMessages');
            for (const m of msgs) if (m.conversationId === App.state.generalConversationId) await App.DB.delete('aiMessages', m.id);
            await App.DB.delete('aiConversations', App.state.generalConversationId);
            App.state.generalConversationId = null;
            await this.renderView();
        },

        async saveAIKey() {
            const key = document.getElementById('api-key-input').value;
            await App.saveSetting('openrouterKey', key);
            this.showSnackbar('API Key saved');
            await this.render();
        },
        async fetchModels() {
            this.showSnackbar('Fetching models...');
            const models = await App.AI.fetchModels();
            if(models.length > 0) { this.showSnackbar(`${models.length} models loaded`); await this.render(); }
            else this.showSnackbar('Failed to fetch models. Try manual entry.');
        },
        filterModels() {
            const q = document.getElementById('model-search').value.toLowerCase();
            const models = App.AI.getCachedModels();
            const resultsDiv = document.getElementById('model-search-results');
            const currentModel = App.state.settings.selectedModel;
            const filtered = models.filter(m => m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q)).slice(0, 50);
            if(filtered.length === 0) { resultsDiv.innerHTML = '<div class="text-xs text-muted p-2">No models found.</div>'; return; }
            resultsDiv.innerHTML = filtered.map(m => `
                <div class="model-item ${m.id === currentModel ? 'selected' : ''}" onclick="App.UI.selectModel('${m.id}')">
                    <span class="model-item-name">${App.utils.escapeHtml(m.name)}</span>
                    <span class="model-item-id">${App.utils.escapeHtml(m.id)}</span>
                </div>
            `).join('');
        },
        async selectModel(modelId) {
            document.getElementById('model-manual').value = modelId;
            await this.saveModel();
        },
        async saveModel() {
            const manualInput = document.getElementById('model-manual');
            let model = manualInput ? manualInput.value.trim() : '';
            if (!model) return this.showSnackbar('Please select or enter a model ID');
            await App.saveSetting('selectedModel', model);
            this.showSnackbar('Model saved');
            await this.render();
        },
        async testAI() {
            this.showSnackbar('Testing connection...');
            const res = await App.AI.testConnection();
            if(res.success) this.showSnackbar('OpenRouter connection is working.');
            else this.showSnackbar(`Connection failed. ${res.error}`);
        },
        async changeTheme(theme) {
            await App.saveSetting('theme', theme);
            document.documentElement.setAttribute('data-theme', theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme);
        },
        async importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json,.json';
            input.onchange = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const success = await App.Data.import(ev.target.result, 'merge');
                    this.showSnackbar(success ? 'Data imported' : 'Import failed');
                    if(success) await this.render();
                };
                reader.readAsText(file);
            };
            input.click();
        },
        async clearData() {
            if(confirm('This will permanently delete all local data. Are you sure?')) {
                await App.DB.clear('layers'); await App.DB.clear('items'); await App.DB.clear('itemLayers'); await App.DB.clear('layerRelations'); await App.DB.clear('aiConversations'); await App.DB.delete('settings', 'onboarded');
                this.showSnackbar('All data cleared');
                location.reload();
            }
        },

        async updateTaskStatus(id, status) {
            const item = await App.Items.get(id);
            if(item) {
                item.metadata = item.metadata || {};
                item.metadata.status = ['todo', 'progress', 'done'].includes(status) ? status : 'todo';
                await App.Items.update(id, { metadata: item.metadata });
                this.showSnackbar('Task status updated');
                await this.render();
            }
        },

        updateItemField(field, value) {
            if (!App.UI._debouncedUpdate) {
                App.UI._debouncedUpdate = App.utils.debounce(async (field, value) => {
                    const status = document.getElementById('save-status');
                    if(status) status.textContent = 'Saving...';
                    const item = await App.Items.get(App.state.currentItemId);
                    if(!item) return;
                    if(field.includes('.')) { const [k, sub] = field.split('.'); item.metadata[sub] = value; }
                    else item[field] = value;
                    await App.Items.update(item.id, item);
                    if(status) status.textContent = 'Saved';
                }, 400);
            }
            App.UI._debouncedUpdate(field, value);
        },

        closeModals() { document.getElementById('modal-root').innerHTML = ''; document.getElementById('ctx-menu-root').innerHTML = ''; },
        showSnackbar(msg) {
            const root = document.getElementById('snackbar-root');
            const id = App.utils.uuid();
            root.innerHTML = `<div class="snackbar" id="snack-${id}"><span class="snackbar-text"></span></div>`;
            const text = document.querySelector(`#snack-${id} .snackbar-text`);
            if (text) text.textContent = String(msg ?? '');
            setTimeout(() => { const el = document.getElementById(`snack-${id}`); if(el) el.remove(); }, 3000);
        },
        showOnboarding() {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="modal-overlay">
                    <div class="modal" style="max-width: 480px; text-align: center;">
                        <h2 class="view-title" style="font-size: 28px; margin-bottom: 8px;">Welcome to Layer</h2>
                        <p class="text-muted mb-6">Your digital world, organized by context instead of folders.</p>
                        <div class="flex flex-col gap-2 mb-6">
                            <button class="btn btn-primary" onclick="App.UI.openCreateLayer()">Create your first Layer</button>
                            <button class="btn btn-ghost" onclick="App.UI.skipOnboarding()">Skip</button>
                        </div>
                    </div>
                </div>`;
        },
        async skipOnboarding() {
            await App.saveSetting('onboarded', true);
            this.closeModals();
        }
    }
};


App.init();
</script>
</body>
</html
