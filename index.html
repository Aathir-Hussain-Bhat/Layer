<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Layer - Your digital world, organized by context instead of folders.">
    <title>Layer — Your context, organized.</title>
    
    <!-- Dynamic PWA Manifest & Theme will be injected here by JS -->
    <meta name="theme-color" content="#0a0a0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-base: #0a0a0b;
            --bg-elevated: #141416;
            --bg-surface: #1c1c1f;
            --bg-hover: #252528;
            --border-subtle: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.15);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-w: 260px;
            --context-w: 340px;
        }

        [data-theme="light"] {
            --bg-base: #f8f9fa;
            --bg-elevated: #ffffff;
            --bg-surface: #f1f3f5;
            --bg-hover: #e9ecef;
            --border-subtle: rgba(0,0,0,0.08);
            --border-strong: rgba(0,0,0,0.15);
            --text-primary: #111113;
            --text-secondary: #495057;
            --text-muted: #868e96;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1c45c7;
            --accent-glow: rgba(37, 99, 235, 0.1);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.5;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr var(--context-w);
            grid-template-rows: 1fr;
            height: 100vh;
            background-image: radial-gradient(circle at 100% 0%, rgba(59, 130, 246, 0.03), transparent 40%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

        button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; }
        a { color: var(--accent-blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Layout */
        .sidebar {
            border-right: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100vh;
            z-index: 10;
            transition: transform 300ms ease;
        }
        
        .main-content {
            overflow-y: auto;
            background: var(--bg-base);
            position: relative;
            height: 100vh;
        }

        .context-panel {
            border-left: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
            z-index: 10;
            transition: transform 300ms ease;
        }

        /* Sidebar */
        .sb-header { padding: 24px 20px 12px; display: flex; align-items: center; gap: 10px; }
        .sb-logo { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .sb-logo span { color: var(--accent-blue); }
        
        .sb-section { padding: 8px 12px; }
        .sb-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); padding: 8px 8px 4px; font-weight: 600; }
        
        .sb-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; border-radius: var(--radius-sm);
            color: var(--text-secondary); width: 100%; text-align: left;
            transition: background var(--transition), color var(--transition);
            font-size: 14px; position: relative;
        }
        .sb-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sb-item.active { background: var(--bg-hover); color: var(--text-primary); }
        .sb-item.active::before {
            content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
            height: 16px; width: 3px; background: var(--accent-blue); border-radius: 0 2px 2px 0;
        }
        .sb-item svg { width: 16px; height: 16px; flex-shrink: 0; }
        
        .sb-list { flex: 1; padding-bottom: 12px; overflow-y: auto; }
        .sb-footer { border-top: 1px solid var(--border-subtle); padding: 12px; display: flex; gap: 8px; }

        /* Topbar / Mobile */
        .mobile-topbar { display: none; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); align-items: center; justify-content: space-between; background: var(--bg-elevated); position: sticky; top: 0; z-index: 5; }
        .mobile-topbar h2 { font-size: 16px; font-weight: 600; }
        .icon-btn { padding: 6px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .icon-btn svg { width: 20px; height: 20px; }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-elevated); border-top: 1px solid var(--border-subtle); padding: 8px 0 16px; justify-content: space-around; z-index: 20; }

        /* Views */
        .view { padding: 32px 48px; max-width: 900px; margin: 0 auto; padding-bottom: 100px; animation: fadeIn 200ms ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .view-header { margin-bottom: 32px; }
        .view-title { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
        .view-subtitle { color: var(--text-secondary); font-size: 16px; }

        /* Cards & Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        
        .card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px;
            cursor: pointer;
            transition: border-color var(--transition), transform var(--transition), background var(--transition);
            display: flex; flex-direction: column; gap: 8px;
            position: relative; overflow: hidden;
        }
        .card:hover { border-color: var(--border-strong); background: var(--bg-surface); }
        .card-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .card-desc { font-size: 13px; color: var(--text-secondary); flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        
        .layer-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
        
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-secondary); font-weight: 500; }
        .badge.high { color: #f87171; border-color: rgba(248,113,113,0.2); background: rgba(248,113,113,0.1); }
        .badge.medium { color: #fbbf24; border-color: rgba(251,191,36,0.2); background: rgba(251,191,36,0.1); }
        .badge.low { color: #34d399; border-color: rgba(52,211,153,0.2); background: rgba(52,211,153,0.1); }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; transition: all var(--transition); border: 1px solid transparent; }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-primary:hover { background: var(--accent-blue-hover); }
        .btn-secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border-subtle); }
        .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-strong); }
        .btn-ghost { color: var(--text-secondary); }
        .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-danger { background: rgba(248,113,113,0.1); color: #f87171; border-color: rgba(248,113,113,0.2); }
        .btn-danger:hover { background: rgba(248,113,113,0.2); }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 100ms ease; }
        .modal { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 500px; box-shadow: var(--shadow-lg); animation: slideUp 200ms ease; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        
        .input { width: 100%; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; color: var(--text-primary); transition: border-color var(--transition); }
        .input:focus { outline: none; border-color: var(--accent-blue); }
        textarea.input { resize: vertical; min-height: 80px; line-height: 1.5; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Quick Capture */
        .qc-overlay { background: rgba(0,0,0,0.4); }
        .qc-modal { max-width: 560px; padding: 0; overflow: hidden; }
        .qc-input { width: 100%; border: none; background: transparent; padding: 24px; font-size: 22px; color: var(--text-primary); font-weight: 500; }
        .qc-input:focus { outline: none; }
        .qc-input::placeholder { color: var(--text-muted); }
        .qc-footer { padding: 12px 16px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); }
        .qc-types { display: flex; gap: 4px; }
        .qc-type-btn { padding: 4px 10px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); border: 1px solid transparent; }
        .qc-type-btn.active { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-subtle); }

        /* Command Palette */
        .cp-overlay { background: rgba(0,0,0,0.4); align-items: flex-start; padding-top: 15vh; }
        .cp-modal { max-width: 600px; border-radius: var(--radius-md); overflow: hidden; }
        .cp-search { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); font-size: 16px; background: var(--bg-elevated); }
        .cp-results { max-height: 400px; overflow-y: auto; padding: 8px; }
        .cp-item { padding: 10px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .cp-item:hover, .cp-item.selected { background: var(--bg-hover); }
        .cp-item svg { width: 16px; height: 16px; color: var(--text-secondary); }
        .cp-item-type { margin-left: auto; font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        /* Context Panel / AI */
        .ctx-header { padding: 16px; border-bottom: 1px solid var(--border-subtle); }
        .ctx-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ctx-tabs { display: flex; gap: 4px; }
        .ctx-tab { padding: 6px 10px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .ctx-tab.active { background: var(--bg-hover); color: var(--text-primary); }
        
        .ctx-close-btn { display: none; padding: 4px; }
        
        .ctx-content { flex: 1; overflow-y: auto; padding: 16px; }
        
        .ai-msg { margin-bottom: 16px; }
        .ai-msg-role { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
        .ai-msg-content { font-size: 14px; line-height: 1.6; color: var(--text-primary); }
        .ai-msg-assistant .ai-msg-content { background: var(--bg-surface); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
        
        .ai-thinking { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
        .ai-thinking span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: blink 1.4s infinite both; }
        .ai-thinking span:nth-child(2) { animation-delay: .2s; }
        .ai-thinking span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

        .ai-action-card { background: var(--bg-base); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 12px; margin-top: 8px; }
        .ai-action-title { font-size: 12px; font-weight: 600; color: var(--accent-blue); margin-bottom: 8px; text-transform: uppercase; }
        .ai-action-item { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border-subtle); }
        .ai-action-item:last-child { border-bottom: none; }

        .ai-suggestions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .ai-suggestion { text-align: left; padding: 8px 12px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-primary); }
        .ai-suggestion:hover { background: var(--bg-hover); border-color: var(--border-strong); }

        /* Context Menu */
        .ctx-menu { position: fixed; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 6px; z-index: 200; box-shadow: var(--shadow-lg); min-width: 180px; animation: fadeIn 100ms ease; }
        .ctx-menu-item { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
        .ctx-menu-item:hover { background: var(--bg-hover); }
        .ctx-menu-item.danger { color: #f87171; }
        .ctx-menu-sep { height: 1px; background: var(--border-subtle); margin: 4px 0; }

        /* Snackbar */
        .snackbar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); border: 1px solid var(--border-strong); padding: 12px 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); z-index: 150; display: flex; align-items: center; gap: 12px; animation: slideUp 200ms ease; }
        .snackbar-text { font-size: 14px; }

        /* Empty States */
        .empty-state { text-align: center; padding: 48px 24px; }
        .empty-state-icon { width: 48px; height: 48px; margin: 0 auto 16px; opacity: 0.5; }
        .empty-state-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .empty-state-desc { color: var(--text-secondary); max-width: 400px; margin: 0 auto 16px; }

        /* Item Editor */
        .item-editor { max-width: 720px; margin: 0 auto; padding: 32px; padding-bottom: 100px; }
        .item-header { margin-bottom: 24px; }
        .item-title-input { width: 100%; background: transparent; border: none; font-size: 28px; font-weight: 700; color: var(--text-primary); padding: 0; letter-spacing: -0.5px; }
        .item-title-input:focus { outline: none; }
        .item-body-input { width: 100%; background: transparent; border: none; font-size: 16px; color: var(--text-primary); line-height: 1.7; min-height: 400px; resize: none; padding: 0; }
        .item-body-input:focus { outline: none; }
        
        .meta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
        .tag { display: inline-flex; align-items: center; gap: 4px; background: var(--bg-surface); padding: 4px 8px; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); }
        
        /* Layer Header */
        .layer-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
        .layer-header-info { flex: 1; }
        .layer-header h1 { font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .layer-header p { color: var(--text-secondary); margin-top: 4px; }
        
        /* Login View */
        .login-overlay { background: var(--bg-base); background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1), transparent 60%); position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .login-card { max-width: 400px; width: 100%; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); text-align: center; }
        .login-logo { font-weight: 700; font-size: 24px; letter-spacing: -0.5px; margin-bottom: 24px; }
        .login-logo span { color: var(--accent-blue); }

        /* PWA Install Banner */
        .pwa-banner { position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 360px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 16px; z-index: 150; display: flex; gap: 12px; align-items: center; animation: slideUp 300ms ease; }
        .pwa-banner-icon { width: 40px; height: 40px; background: var(--bg-surface); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .pwa-banner-text { flex: 1; }
        .pwa-banner-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .pwa-banner-desc { font-size: 12px; color: var(--text-muted); }
        .pwa-banner-actions { display: flex; flex-direction: column; gap: 4px; }

        /* Offline Indicator */
        .offline-indicator { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(248, 113, 113, 0.9); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; z-index: 200; display: none; box-shadow: var(--shadow-md); }

        /* Model Search */
        .model-search-container { position: relative; margin-bottom: 8px; }
        .model-search-results { max-height: 200px; overflow-y: auto; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); background: var(--bg-surface); }
        .model-item { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .model-item:hover { background: var(--bg-hover); }
        .model-item-name { font-size: 13px; font-weight: 500; }
        .model-item-id { font-size: 11px; color: var(--text-muted); }
        .model-item.selected { background: var(--accent-glow); }

        /* Creator Wall */
        .creator-card { text-align: center; }
        .creator-img { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 16px; display: block; object-fit: cover; border: 2px solid var(--border-strong); box-shadow: var(--shadow-md); }
        .social-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .social-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-surface); color: var(--text-primary); transition: all 150ms ease; border: 1px solid var(--border-subtle); }
        .social-btn:hover { background: var(--accent-blue); color: white; transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .social-btn svg { width: 18px; height: 18px; }

        /* Mobile Media Queries */
        @media (max-width: 1024px) {
            body { grid-template-columns: 1fr; }
            .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 80%; max-width: 300px; transform: translateX(-100%); box-shadow: var(--shadow-lg); }
            .sidebar.open { transform: translateX(0); }
            .context-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 90%; max-width: 360px; transform: translateX(100%); box-shadow: var(--shadow-lg); }
            .context-panel.open { transform: translateX(0); }
            .ctx-close-btn { display: flex; }
            .mobile-topbar { display: flex; }
            .bottom-nav { display: flex; }
            .view { padding: 24px 16px 120px; }
            .item-editor { padding: 16px 16px 100px; }
        }
        
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* Utilities */
        .hidden { display: none !important; }
        .text-muted { color: var(--text-muted); }
        .mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
        .flex { display: flex; } .flex-col { flex-direction: column; }
        .gap-2 { gap: 8px; } .gap-4 { gap: 16px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .w-full { width: 100%; }
        .text-sm { font-size: 13px; } .text-xs { font-size: 12px; }
        .flex-1 { flex: 1; }
        .mb-4 { margin-bottom: 16px; }
        .opacity-75 { opacity: 0.75; }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sb-header">
            <div class="sb-logo">Layer<span>.</span></div>
            <button class="icon-btn ctx-close-btn" style="margin-left: auto;" onclick="document.getElementById('sidebar').classList.remove('open')">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="sb-section">

<script>
/* ============================================================================
 * LAYER - Context Workspace (Single-File PWA)
 * Architecture: Vanilla JS, IndexedDB, OpenRouter AI, Dynamic PWA Manifest
 * ============================================================================
 */

const App = {
    config: {
        DB_NAME: 'layer_db',
        DB_VERSION: 1,
        DEFAULT_TEMP: 0.7,
        DEFAULT_MAX_TOKENS: 1000,
        OPENROUTER_URL: 'https://openrouter.ai/api/v1'
    },
    state: {
        db: null,
        currentView: 'home',
        currentLayerId: null,
        currentItemId: null,
        currentConversationId: null,
        generalConversationId: null,
        contextTab: 'ai',
        searchQuery: '',
        settings: {},
        abortController: null,
        cache: {},
        user: null,
        deferredPrompt: null
    },
    
    // ============================================================
    // INITIALIZATION
    // ============================================================
    async init() {
        this.PWA.init(); // Setup PWA features early
        this.Auth.init();
        if (!this.state.user) {
            this.UI.showLogin();
            return; // Halt app load until login
        }

        await this.DB.init();
        await this.loadSettings();
        this.Router.init();
        this.Events.bindGlobal();
        await this.UI.render();
        this.checkOnboarding();
    },

    checkOnboarding() {
        if (!this.state.settings.onboarded) {
            this.UI.showOnboarding();
        }
    },

    // ============================================================
    // PWA & OFFLINE SUPPORT
    // ============================================================
    PWA: {
        init() {
            this.setupManifest();
            this.setupInstallPrompt();
            this.setupOfflineIndicator();
            this.setupServiceWorker();
        },
        setupManifest() {
            const iconUrl = "https://res.cloudinary.com/prjgzqvy/image/upload/v1787650171/grok_1787647904984_nzcznv.jpg";
            const manifest = {
                name: "Layer - Context Workspace",
                short_name: "Layer",
                start_url: ".",
                display: "standalone",
                background_color: "#0a0a0b",
                theme_color: "#0a0a0b",
                icons: [
                    {
                        src: iconUrl,
                        sizes: "512x512",
                        type: "image/jpeg",
                        purpose: "any maskable"
                    }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);

            const appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.href = iconUrl;
            document.head.appendChild(appleLink);
        },
        setupInstallPrompt() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                App.state.deferredPrompt = e;
                if (!localStorage.getItem('layer_pwa_dismissed') && !localStorage.getItem('layer_pwa_installed')) {
                    App.UI.showInstallBanner();
                }
            });
            window.addEventListener('appinstalled', () => {
                localStorage.setItem('layer_pwa_installed', 'true');
                App.UI.hideInstallBanner();
                App.state.deferredPrompt = null;
                App.UI.showSnackbar('Layer installed successfully!');
            });
        },
        async doInstall() {
            if (App.state.deferredPrompt) {
                App.state.deferredPrompt.prompt();
                const { outcome } = await App.state.deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    localStorage.setItem('layer_pwa_installed', 'true');
                    App.UI.hideInstallBanner();
                } else {
                    localStorage.setItem('layer_pwa_dismissed', 'true');
                    App.UI.hideInstallBanner();
                }
                App.state.deferredPrompt = null;
            }
        },
        dismissInstall() {
            localStorage.setItem('layer_pwa_dismissed', 'true');
            App.UI.hideInstallBanner();
        },
        setupOfflineIndicator() {
            const indicator = document.getElementById('offline-indicator');
            const updateStatus = () => {
                indicator.style.display = navigator.onLine ? 'none' : 'block';
            };
            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);
            updateStatus();
        },
        setupServiceWorker() {
            if ('serviceWorker' in navigator && window.isSecureContext) {
                try {
                    const swCode = `
                        const CACHE_NAME = 'layer-shell-v1';
                        self.addEventListener('install', e => self.skipWaiting());
                        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                        self.addEventListener('fetch', e => {
                            if (e.request.method !== 'GET') return;
                            e.respondWith(
                                caches.match(e.request).then(cached => {
                                    const networkFetch = fetch(e.request).then(response => {
                                        if (response && response.status === 200) {
                                            const responseClone = response.clone();
                                            caches.open(CACHE_NAME).then(cache => cache.put(e.request, responseClone));
                                        }
                                        return response;
                                    }).catch(() => cached);
                                    return cached || networkFetch;
                                })
                            );
                        });
                    `;
                    const blob = new Blob([swCode], {type: 'text/javascript'});
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).catch(err => console.log("SW registration skipped (expected in single-file dev):", err));
                } catch(e) { console.log("SW setup skipped:", e); }
            }
        }
    },

    // ============================================================
    // AUTHENTICATION (LocalStorage)
    // ============================================================
    Auth: {
        init() {
            const user = localStorage.getItem('layer_user');
            if (user) App.state.user = JSON.parse(user);
        },
        getUsers() { return JSON.parse(localStorage.getItem('layer_users') || '{}'); },
        register(username, password) {
            if (!username || !password) return { success: false, error: 'Username and password required' };
            const users = this.getUsers();
            if (users[username]) return { success: false, error: 'User already exists' };
            users[username] = { password: btoa(password) };
            localStorage.setItem('layer_users', JSON.stringify(users));
            return this.login(username, password);
        },
        login(username, password) {
            if (!username || !password) return { success: false, error: 'Username and password required' };
            const users = this.getUsers();
            if (!users[username] || users[username].password !== btoa(password)) return { success: false, error: 'Invalid credentials' };
            const user = { username };
            App.state.user = user;
            localStorage.setItem('layer_user', JSON.stringify(user));
            return { success: true };
        },
        logout() {
            localStorage.removeItem('layer_user');
            App.state.user = null;
            location.reload();
        }
    },

    // ============================================================
    // UTILITIES
    // ============================================================
    utils: {
        uuid() { return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; const v = c == 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); },
        formatTime(ts) { return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); },
        formatDay(ts) { return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }); },
        escapeHtml(str) { if(!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; },
        debounce(fn, delay) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); }; },
        isValidUrl(str) { try { new URL(str); return true; } catch { return false; } }
    },

    // ============================================================
    // DATABASE (IndexedDB)
    // ============================================================
    DB: {
        db: null,
        async init() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(App.config.DB_NAME, App.config.DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('layers')) db.createObjectStore('layers', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('itemLayers')) db.createObjectStore('itemLayers', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('layerRelations')) db.createObjectStore('layerRelations', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                    if (!db.objectStoreNames.contains('aiConversations')) db.createObjectStore('aiConversations', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('aiMessages')) db.createObjectStore('aiMessages', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { this.db = e.target.result; App.state.db = this.db; resolve(); };
                req.onerror = (e) => reject(e.target.error);
            });
        },
        async tx(store, mode = 'readonly') { return this.db.transaction(store, mode).objectStore(store); },
        async get(store, key) { const t = await this.tx(store); return new Promise(r => { const req = t.get(key); req.onsuccess = () => r(req.result); req.onerror = () => r(null); }); },
        async getAll(store) { const t = await this.tx(store); return new Promise(r => { const req = t.getAll(); req.onsuccess = () => r(req.result || []); req.onerror = () => r([]); }); },
        async put(store, val) { const t = await this.tx(store, 'readwrite'); return new Promise(r => { const req = t.put(val); req.onsuccess = () => r(val); req.onerror = () => r(null); }); },
        async delete(store, key) { const t = await this.tx(store, 'readwrite'); return new Promise(r => { const req = t.delete(key); req.onsuccess = () => r(true); req.onerror = () => r(false); }); },
        async clear(store) { const t = await this.tx(store, 'readwrite'); return new Promise(r => { const req = t.clear(); req.onsuccess = () => r(true); req.onerror = () => r(false); }); }
    },

    // ============================================================
    // SETTINGS
    // ============================================================
    async loadSettings() {
        const settingsList = await this.DB.getAll('settings');
        this.state.settings = settingsList.reduce((acc, s) => { acc[s.key] = s.value; return acc; }, {});
        if (!this.state.settings.theme) this.state.settings.theme = 'dark';
        if (!this.state.settings.temp) this.state.settings.temp = this.config.DEFAULT_TEMP;
        if (!this.state.settings.maxTokens) this.state.settings.maxTokens = this.config.DEFAULT_MAX_TOKENS;
        document.documentElement.setAttribute('data-theme', this.state.settings.theme);
    },
    async saveSetting(key, value) {
        this.state.settings[key] = value;
        await this.DB.put('settings', { key, value });
    },

    // ============================================================
    // LAYERS
    // ============================================================
    Layers: {
        async create(data) {
            const layer = {
                id: App.utils.uuid(),
                name: data.name || 'Untitled Layer',
                description: data.description || '',
                icon: data.icon || 'L',
                accent: data.accent || '#3b82f6',
                favorite: false,
                archived: false,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            await App.DB.put('layers', layer);
            return layer;
        },
        async update(id, updates) {
            const layer = await App.DB.get('layers', id);
            if (!layer) return null;
            Object.assign(layer, updates, { updatedAt: Date.now() });
            await App.DB.put('layers', layer);
            return layer;
        },
        async delete(id) {
            await App.DB.delete('layers', id);
            const items = await App.Items.getByLayer(id);
            for(const il of items) await App.DB.delete('itemLayers', il.id);
            const rels = await App.DB.getAll('layerRelations');
            for(const r of rels) { if(r.sourceLayerId === id || r.targetLayerId === id) await App.DB.delete('layerRelations', r.id); }
        },
        async get(id) { return App.DB.get('layers', id); },
        async getAll() { 
            const layers = await App.DB.getAll('layers');
            return layers.filter(l => !l.archived).sort((a,b) => b.updatedAt - a.updatedAt);
        }
    },

    // ============================================================
    // ITEMS
    // ============================================================
    Items: {
        async create(type, data) {
            const item = {
                id: App.utils.uuid(),
                type,
                title: data.title || 'Untitled',
                content: data.content || '',
                metadata: data.metadata || {},
                tags: data.tags || [],
                favorite: false,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            await App.DB.put('items', item);
            if (data.layerId) await App.Relations.addItemToLayer(item.id, data.layerId);
            return item;
        },
        async update(id, updates) {
            const item = await App.DB.get('items', id);
            if (!item) return null;
            Object.assign(item, updates, { updatedAt: Date.now() });
            await App.DB.put('items', item);
            return item;
        },
        async delete(id) {
            await App.DB.delete('items', id);
            const ils = await App.DB.getAll('itemLayers');
            for(const il of ils) if(il.itemId === id) await App.DB.delete('itemLayers', il.id);
        },
        async get(id) { return App.DB.get('items', id); },
        async getAll() { 
            const items = await App.DB.getAll('items');
            return items.sort((a,b) => b.updatedAt - a.updatedAt);
        },
        async getByLayer(layerId) {
            const ils = await App.DB.getAll('itemLayers');
            const itemIds = ils.filter(il => il.layerId === layerId).map(il => il.itemId);
            const items = [];
            for(const id of itemIds) { const it = await App.DB.get('items', id); if(it) items.push(it); }
            return items.sort((a,b) => b.updatedAt - a.updatedAt);
        }
    },

    // ============================================================
    // RELATIONSHIPS
    // ============================================================
    Relations: {
        async addItemToLayer(itemId, layerId) {
            const id = `${itemId}_${layerId}`;
            const existing = await App.DB.get('itemLayers', id);
            if(existing) return existing;
            const rel = { id, itemId, layerId, createdAt: Date.now() };
            return App.DB.put('itemLayers', rel);
        },
        async removeItemFromLayer(itemId, layerId) {
            return App.DB.delete('itemLayers', `${itemId}_${layerId}`);
        },
        async getLayersForItem(itemId) {
            const ils = await App.DB.getAll('itemLayers');
            const layerIds = ils.filter(il => il.itemId === itemId).map(il => il.layerId);
            const layers = [];
            for(const id of layerIds) { const l = await App.DB.get('layers', id); if(l) layers.push(l); }
            return layers;
        },
        async connectLayers(sourceId, targetId) {
            const id = `${sourceId}_${targetId}`;
            if(sourceId === targetId) return;
            const existing = await App.DB.get('layerRelations', id);
            if(existing) return;
            const rel = { id, sourceLayerId: sourceId, targetLayerId: targetId, type: 'related', createdAt: Date.now() };
            return App.DB.put('layerRelations', rel);
        },
        async disconnectLayers(sourceId, targetId) {
            await App.DB.delete('layerRelations', `${sourceId}_${targetId}`);
            await App.DB.delete('layerRelations', `${targetId}_${sourceId}`);
        },
        async getConnectedLayers(layerId) {
            const rels = await App.DB.getAll('layerRelations');
            const connectedIds = rels.filter(r => r.sourceLayerId === layerId || r.targetLayerId === layerId)
                                    .map(r => r.sourceLayerId === layerId ? r.targetLayerId : r.sourceLayerId);
            const layers = [];
            for(const id of [...new Set(connectedIds)]) { const l = await App.DB.get('layers', id); if(l) layers.push(l); }
            return layers;
        }
    },

    // ============================================================
    // SEARCH
    // ============================================================
    Search: {
        async query(q) {
            if(!q || q.trim() === '') return [];
            const term = q.toLowerCase();
            const results = [];
            
            const layers = await App.DB.getAll('layers');
            layers.forEach(l => {
                if(l.name.toLowerCase().includes(term) || (l.description && l.description.toLowerCase().includes(term))) {
                    results.push({ type: 'layer', id: l.id, title: l.name, desc: l.description, timestamp: l.updatedAt });
                }
            });

            const items = await App.DB.getAll('items');
            items.forEach(it => {
                let matched = false;
                let desc = '';
                if(it.title.toLowerCase().includes(term)) { matched = true; desc = it.content || ''; }
                else if(it.content && it.content.toLowerCase().includes(term)) { matched = true; desc = it.content; }
                else if(it.tags && it.tags.some(t => t.toLowerCase().includes(term))) { matched = true; desc = `Tag: ${it.tags.join(', ')}`; }
                
                if(matched) results.push({ type: it.type, id: it.id, title: it.title, desc: desc.substring(0, 100), timestamp: it.updatedAt });
            });

            return results.sort((a,b) => b.timestamp - a.timestamp);
        }
    },

    // ============================================================
    // AI & OPENROUTER
    // ============================================================
    AI: {
        async testConnection() {
            const key = App.state.settings.openrouterKey;
            if(!key) return { success: false, error: 'No API key provided' };
            try {
                const res = await fetch(`${App.config.OPENROUTER_URL}/models`, { headers: { 'Authorization': `Bearer ${key}` }});
                if(res.ok) return { success: true };
                const err = await res.json();
                return { success: false, error: err.error || 'Invalid API key or network error' };
            } catch(e) { return { success: false, error: e.message }; }
        },
        async fetchModels() {
            const key = App.state.settings.openrouterKey;
            if(!key) return [];
            try {
                const res = await fetch(`${App.config.OPENROUTER_URL}/models`, { headers: { 'Authorization': `Bearer ${key}` }});
                if(!res.ok) return [];
                const data = await res.json();
                await App.saveSetting('cachedModels', data.data);
                return data.data;
            } catch(e) { return []; }
        },
        getCachedModels() { return App.state.settings.cachedModels || []; },
        
        buildContext(layerId, itemId) {
            let context = "CURRENT CONTEXT:\n";
            if(layerId) {
                const layer = App.state.cache.layers?.find(l => l.id === layerId);
                if(layer) {
                    context += `LAYER: ${layer.name}\nDESCRIPTION: ${layer.description || 'N/A'}\n`;
                    const items = App.state.cache.items?.filter(i => App.state.cache.itemLayers?.some(il => il.itemId === i.id && il.layerId === layerId));
                    if(items && items.length) {
                        context += "RELEVANT ITEMS:\n";
                        items.slice(0, 8).forEach(it => {
                            context += `- [${it.type.toUpperCase()}] ${it.title}: ${(it.content || '').substring(0, 150)}\n`;
                        });
                    }
                    const conns = App.state.cache.relations?.filter(r => r.sourceLayerId === layerId || r.targetLayerId === layerId);
                    if(conns && conns.length) {
                        context += "CONNECTED LAYERS:\n";
                        conns.forEach(c => {
                            const id = c.sourceLayerId === layerId ? c.targetLayerId : c.sourceLayerId;
                            const l = App.state.cache.layers?.find(x => x.id === id);
                            if(l) context += `- ${l.name}\n`;
                        });
                    }
                }
            }
            if(itemId) {
                const item = App.state.cache.items?.find(i => i.id === itemId);
                if(item) {
                    context += `\nSELECTED ITEM:\n[${item.type.toUpperCase()}] ${item.title}\n${item.content || ''}\n`;
                }
            }
            return context;
        },

        async streamChat(prompt, layerId, itemId, onChunk, onAction, onDone, onError) {
            const key = App.state.settings.openrouterKey;
            const model = App.state.settings.selectedModel;
            
            if(!key || !model) { onError('API Key or Model not configured.'); return; }
            if(!navigator.onLine) { onError('You are offline. AI requires an internet connection.'); return; }

            const sysPrompt = `You are Layer AI, a contextual workspace assistant. You help users organize their digital context.
You analyze the provided context and help summarize, brainstorm, or extract tasks.
When you want to propose creating tasks, format your response EXACTLY like this:
<action type="create_tasks">
[{"title": "Task 1"}, {"title": "Task 2"}]
</action>
Then write your normal response. Do not modify user data without confirmation. Be concise.`;

            const context = App.AI.buildContext(layerId, itemId);
            const messages = [
                { role: "system", content: sysPrompt },
                { role: "system", content: context },
                { role: "user", content: prompt }
            ];

            App.state.abortController = new AbortController();

            try {
                const res = await fetch(`${App.config.OPENROUTER_URL}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model, messages, stream: true,
                        temperature: App.state.settings.temp,
                        max_tokens: App.state.settings.maxTokens
                    }),
                    signal: App.state.abortController.signal
                });

                if(!res.ok) {
                    const err = await res.json();
                    onError(err.error || 'Request failed');
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let buffer = '';

                while(true) {
                    const { done, value } = await reader.read();
                    if(done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for(const line of lines) {
                        if(line.startsWith('data: ')) {
                            const json = line.slice(6);
                            if(json === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(json);
                                const delta = parsed.choices[0]?.delta?.content;
                                if(delta) {
                                    fullText += delta;
                                    onChunk(delta);
                                }
                            } catch(e) { /* ignore parse errors for incomplete chunks */ }
                        }
                    }
                }

                const actionRegex = /<action type="create_tasks">([\s\S]*?)<\/action>/;
                const match = fullText.match(actionRegex);
                if(match) {
                    try {
                        const tasks = JSON.parse(match[1].trim());
                        onAction({ type: 'create_tasks', tasks, layerId });
                    } catch(e) { console.error("Failed to parse AI action", e); }
                }
                onDone(fullText.replace(actionRegex, '').trim());
            } catch(err) {
                if(err.name === 'AbortError') onError('Generation stopped.');
                else onError(err.message);
            }
        }
    },

    // ============================================================
    // IMPORT / EXPORT
    // ============================================================
    Data: {
        async export() {
            const data = {
                layers: await App.DB.getAll('layers'),
                items: await App.DB.getAll('items'),
                itemLayers: await App.DB.getAll('itemLayers'),
                layerRelations: await App.DB.getAll('layerRelations'),
                settings: (await App.DB.getAll('settings')).filter(s => s.key !== 'openrouterKey'),
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `layer-export-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        },
        async import(jsonStr, mode = 'merge') {
            try {
                const data = JSON.parse(jsonStr);
                if(mode === 'replace') {
                    await App.DB.clear('layers'); await App.DB.clear('items');
                    await App.DB.clear('itemLayers'); await App.DB.clear('layerRelations');
                }
                if(data.layers) for(const l of data.layers) await App.DB.put('layers', l);
                if(data.items) for(const i of data.items) await App.DB.put('items', i);
                if(data.itemLayers) for(const il of data.itemLayers) await App.DB.put('itemLayers', il);
                if(data.layerRelations) for(const r of data.layerRelations) await App.DB.put('layerRelations', r);
                return true;
            } catch(e) { return false; }
        }
    },

    // ROUTER
    // ============================================================
    Router: {
        init() {
            if (this._initialized) return;
            this._initialized = true;
            window.addEventListener('hashchange', () => App.Router.handle());
            this.handle();
        },
        handle() {
            const hash = window.location.hash.slice(1) || 'home';
            const parts = hash.split('/');
            App.state.currentView = parts[0];
            App.state.currentLayerId = parts[1] === 'layer' ? parts[2] : null;
            App.state.currentItemId = parts[1] === 'item' ? parts[2] : null;
            
            if(parts[1] === 'layer') App.state.currentView = 'layer';
            if(parts[1] === 'item') App.state.currentView = 'item';
            
            App.UI.render();
        },
        navigate(view, id = null) {
            let hash = view;
            if(view === 'layer' && id) hash = `layer/layer/${id}`;
            else if(view === 'item' && id) hash = `item/item/${id}`;
            window.location.hash = hash;
        }
    },

    // ============================================================
    // EVENTS
    // ============================================================
    Events: {
        bindGlobal() {
            if (this._initialized) return;
            this._initialized = true;

            document.addEventListener('keydown', (e) => {
                if((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); App.UI.openCommandPalette(); }
                if(e.key === 'q' && !e.target.matches('input, textarea, [contenteditable]')) { e.preventDefault(); App.UI.openQuickCapture(); }
                if((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'Space') { e.preventDefault(); App.UI.openQuickCapture(); }
                if(e.key === 'Escape') { App.UI.closeModals(); }
            });

            document.querySelectorAll('[data-nav]').forEach(btn => {
                btn.addEventListener('click', () => {
                    App.Router.navigate(btn.dataset.nav);
                    document.getElementById('sidebar').classList.remove('open');
                });
            });

            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('context-panel').classList.remove('open');
            });
            document.getElementById('mobile-ctx-btn').addEventListener('click', () => {
                document.getElementById('context-panel').classList.toggle('open');
                document.getElementById('sidebar').classList.remove('open');
            });
            
            document.getElementById('quick-capture-btn').addEventListener('click', () => App.UI.openQuickCapture());

            document.querySelectorAll('.ctx-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    App.state.contextTab = btn.dataset.ctxTab;
                    App.UI.renderContextPanel();
                });
            });

            // Close drawers when clicking outside on mobile
            document.getElementById('main-content').addEventListener('click', (e) => {
                if (window.innerWidth <= 1024) {
                    const sidebar = document.getElementById('sidebar');
                    const ctxPanel = document.getElementById('context-panel');
                    if (!sidebar.contains(e.target) && e.target.id !== 'mobile-menu-btn') {
                        sidebar.classList.remove('open');
                    }
                    if (!ctxPanel.contains(e.target) && e.target.id !== 'mobile-ctx-btn') {
                        ctxPanel.classList.remove('open');
                    }
                }
            });
        }

        async renderContextPanel() {
            const header = document.getElementById('ctx-info');
            const content = document.getElementById('ctx-content');
            const footer = document.getElementById('ctx-footer');
            
            document.querySelectorAll('.ctx-tab').forEach(t => t.classList.toggle('active', t.dataset.ctxTab === App.state.contextTab));

            header.innerHTML = '';
            content.innerHTML = '';
            footer.innerHTML = '';

            if(App.state.contextTab === 'info') {
                if(App.state.currentLayerId) {
                    const l = await App.Layers.get(App.state.currentLayerId);
                    header.innerHTML = `<strong>${l.name}</strong>`;
                    const items = await App.Items.getByLayer(l.id);
                    const conns = await App.Relations.getConnectedLayers(l.id);
                    content.innerHTML = `<div class="flex flex-col gap-4">
                        <div><h4 class="text-xs text-muted mb-2">DESCRIPTION</h4><p class="text-sm">${l.description || 'N/A'}</p></div>
                        <div><h4 class="text-xs text-muted mb-2">ITEMS (${items.length})</h4><div class="flex flex-col gap-1">${items.slice(0,5).map(i => `<div class="text-sm" style="padding: 4px 0; border-bottom: 1px solid var(--border-subtle)">${i.title}</div>`).join('') || 'None'}</div></div>
                        <div><h4 class="text-xs text-muted mb-2">CONNECTIONS (${conns.length})</h4><div class="flex flex-col gap-1">${conns.map(c => `<div class="text-sm">${c.name}</div>`).join('') || 'None'}</div></div>
                    </div>`;
                } else if(App.state.currentItemId) {
                    const it = await App.Items.get(App.state.currentItemId);
                    const layers = await App.Relations.getLayersForItem(it.id);
                    header.innerHTML = `<strong>${it.title}</strong>`;
                    content.innerHTML = `<div class="flex flex-col gap-4">
                        <div><h4 class="text-xs text-muted mb-2">TYPE</h4><p class="text-sm">${it.type}</p></div>
                        <div><h4 class="text-xs text-muted mb-2">LAYERS (${layers.length})</h4><div class="flex flex-col gap-1">${layers.map(l => `<div class="text-sm">${l.name}</div>`).join('') || 'None'}</div></div>
                    </div>`;
                } else {
                    content.innerHTML = `<p class="text-muted text-sm">Select a Layer or Item to see context.</p>`;
                }
            } else {
                if(App.state.currentLayerId) header.innerHTML = `Context: ${(await App.Layers.get(App.state.currentLayerId))?.name || ''}`;
                else if(App.state.currentItemId) header.innerHTML = `Context: ${(await App.Items.get(App.state.currentItemId))?.title || ''}`;
                else header.innerHTML = `Global Assistant`;
                
                if(!App.state.settings.openrouterKey) {
                    content.innerHTML = `<div class="empty-state" style="padding: 24px 0;"><p class="text-sm text-muted mb-4">Configure OpenRouter to enable AI.</p><button class="btn btn-primary" onclick="App.Router.navigate('settings')">Settings</button></div>`;
                    return;
                }

                if(!App.state.currentConversationId) {
                    App.state.currentConversationId = App.utils.uuid();
                    await App.DB.put('aiConversations', { id: App.state.currentConversationId, layerId: App.state.currentLayerId, itemId: App.state.currentItemId, createdAt: Date.now() });
                }
                
                const msgs = (await App.DB.getAll('aiMessages')).filter(m => m.conversationId === App.state.currentConversationId).sort((a,b) => a.createdAt - b.createdAt);
                
                let html = `<div id="ai-messages" class="flex flex-col gap-4">`;
                if(msgs.length === 0) {
                    html += `<div class="ai-suggestions">
                        <button class="ai-suggestion" onclick="App.UI.askAI('Summarize this Layer')">Summarize this context</button>
                        <button class="ai-suggestion" onclick="App.UI.askAI('What should I work on next?')">What should I work on next?</button>
                        <button class="ai-suggestion" onclick="App.UI.askAI('Find related Ideas')">Find related Ideas</button>
                        <button class="ai-suggestion" onclick="App.UI.askAI('Turn this into Tasks')">Turn this into Tasks</button>
                    </div>`;
                } else {
                    msgs.forEach(m => {
                        html += `<div class="ai-msg ai-msg-${m.role}">
                            <div class="ai-msg-role">${m.role}</div>
                            <div class="ai-msg-content">${App.utils.escapeHtml(m.content).replace(/\n/g, '<br>')}</div>
                            ${m.action ? `<div class="ai-action-card"><div class="ai-action-title">Proposed Action: Create Tasks</div>${m.action.tasks.map(t => `<div class="ai-action-item">${t.title}</div>`).join('')}<button class="btn btn-primary mt-2" onclick="App.UI.confirmAction('${m.id}')">Create ${m.action.tasks.length} Tasks</button></div>` : ''}
                        </div>`;
                    });
                }
                html += `</div>`;
                content.innerHTML = html;
                content.scrollTop = content.scrollHeight;

                footer.innerHTML = `
                    <div class="flex gap-2">
                        <input type="text" class="input" id="ai-input" placeholder="Ask Layer AI..." onkeydown="if(event.key==='Enter') App.UI.sendAI()">
                        <button class="btn btn-primary" onclick="App.UI.sendAI()">Send</button>
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button class="btn btn-ghost text-xs" onclick="App.UI.clearConversation()">Clear</button>
                    </div>
                `;
            }
        },

        toggleAuthMode() {
            const link = document.getElementById('auth-mode-link');
            const title = document.querySelector('.login-card .modal-title');
            const btn = document.querySelector('.login-card .btn-primary');
            if (link.textContent === 'Register') {
                link.textContent = 'Login';
                title.textContent = 'Create account';
                btn.textContent = 'Register';
            } else {
                link.textContent = 'Register';
                title.textContent = 'Welcome back';
                btn.textContent = 'Login';
            }
        },

        async handleLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const isRegister = document.getElementById('auth-mode-link').textContent === 'Login';
            const res = isRegister ? App.Auth.register(u, p) : App.Auth.login(u, p);
            if (res.success) {
                this.closeModals();
                await App.init();
            } else {
                const err = document.getElementById('login-error');
                err.textContent = res.error;
                err.style.display = 'block';
            }
        },

            const input = document.getElementById('cp-search');
            const results = document.getElementById('cp-results');
            
            const commands = [
                { title: 'Create Layer', type: 'Action', action: () => { this.closeModals(); this.openCreateLayer(); } },
                { title: 'Create Note', type: 'Action', action: () => { this.closeModals(); this.openAddItem(null, 'note'); } },
                { title: 'Create Task', type: 'Action', action: () => { this.closeModals(); this.openAddItem(null, 'task'); } },
                { title: 'Open AI Assistant', type: 'Navigation', action: () => { this.closeModals(); App.Router.navigate('ai'); } },

                { title: 'Quick Capture', type: 'Action', action: () => { this.closeModals(); this.openQuickCapture(); } }
            ];
            
            const renderResults = (q) => {
                let res = [];
                if(!q) res = commands;
                else {
                    res = commands.filter(c => c.title.toLowerCase().includes(q.toLowerCase()));

                        }
                    });
                    return;

                results.innerHTML = res.map(c => `<div class="cp-item" onclick="window._cpExec('${c.title}')">${c.title} <span class="cp-item-type">${c.type}</span></div>`).join('');

            window._cpExec = (title) => { const cmd = commands.find(c => c.title === title); if(cmd) cmd.action(); };

        async sendAI() {
            const input = document.getElementById('ai-input');
            const prompt = input.value.trim();
            if(!prompt) return;
            
            const convId = App.state.currentConversationId;
            const userMsg = { id: App.utils.uuid(), conversationId: convId, role: 'user', content: prompt, createdAt: Date.now() };
            await App.DB.put('aiMessages', userMsg);
            input.value = '';
            await this.renderContextPanel();
            
            const aiMsgId = App.utils.uuid();
            const aiMsg = { id: aiMsgId, conversationId: convId, role: 'assistant', content: '', createdAt: Date.now(), action: null };

            const msgsDiv = document.getElementById('ai-messages');

                        el.innerHTML += App.utils.escapeHtml(chunk).replace(/\n/g, '<br>');
                    }
                    msgsDiv.scrollTop = msgsDiv.scrollHeight;
                },
                async (action) => {
                    aiMsg.action = action;
                    await App.DB.put('aiMessages', aiMsg);
                    await this.renderContextPanel();
                },
                async (fullText) => {
                    aiMsg.content = fullText;
                    await App.DB.put('aiMessages', aiMsg);
                    await this.renderContextPanel();
                },
                async (err) => {
                    aiMsg.content = `Error: ${err}`;
                    await App.DB.put('aiMessages', aiMsg);
                    await this.renderContextPanel();

        async confirmAction(msgId) {
            const msg = await App.DB.get('aiMessages', msgId);
            if(msg.action) {
                const taskCount = msg.action.tasks.length;
                for(const t of msg.action.tasks) {
                    await App.Items.create('task', { title: t.title, layerId: msg.action.layerId || null, metadata: { status: 'todo', priority: 'medium' } });
                }
                // Remove action from message to hide the button
                msg.action = null; 
                msg.content += "\n\n✅ *Tasks created successfully.*";
                await App.DB.put('aiMessages', msg);
                this.showSnackbar(`${taskCount} tasks created`);
                await this.render();
                await this.renderContextPanel(); // Ensure right panel updates if open
            }
        },

        // --- Item Editor ---
        updateItemField(field, value) {
            if (!App.UI._debouncedUpdate) {
                App.UI._debouncedUpdate = App.utils.debounce(async (field, value) => {
                    const status = document.getElementById('save-status');
                    if(status) status.textContent = 'Saving...';
                    const item = await App.Items.get(App.state.currentItemId);
                    if(!item) return;
                    if(field.includes('.')) { const [k, sub] = field.split('.'); item.metadata[sub] = value; }
                    else item[field] = value;
                    await App.Items.update(item.id, item);
                    if(status) status.textContent = 'Saved';
                }, 400);
            }
            App.UI._debouncedUpdate(field, value);
        },

                <div class="modal-overlay">
                    <div class="modal" style="max-width: 480px; text-align: center;">
                        <h2 class="view-title" style="font-size: 28px; margin-bottom: 8px;">Welcome to Layer</h2>
                        <p class="text-muted mb-6">Your digital world, organized by context instead of folders.</p>
                        <div class="flex flex-col gap-2 mb-6">
                            <button class="btn btn-primary" onclick="App.UI.openCreateLayer()">Create your first Layer</button>
                            <button class="btn btn-ghost" onclick="App.UI.skipOnboarding()">Skip</button>
                        </div>
                    </div>
                </div>`;
        },
        async skipOnboarding() {
            await App.saveSetting('onboarded', true);
            this.closeModals();
        }
    }
};

App.init();
</script>
</body>
    </html>
